or important systems", "content": "Are all of the following logs obtained and stored for at least one year for critical systems (including cloud services) ?\n\n1. Logs are obtained and stored as per \"Appendix 3_Logging and Storage Requirements List\".\n2.The above logs must include the date and time that satisfy the following\n・Same time setting in the system\n・UTC in principle, but time zone is also required when it is unavoidable", "standard": "①All items 1 and 2 on the left must be kept for at least one year for all critical systems used by the company.", "evidence": "① Log configuration screens\n① Logs (actual logs)", "article": "25(2)", "issue": "", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 76, "category": "7.Measures to prepare for incidents and failures", "name": "Log acquisition and storage for PCs", "content": "Have all of the following logs been obtained and stored for at least one year for company-owned PCs?\n\n1. Logs are obtained and stored as per \"Appendix 3_Logging and Storage Requirements List\".\n2.The above logs must include the date and time that satisfy the following\n・Same time setting in the system\n・UTC in principle, but time zone is also required when it is unavoidable", "standard": "①All items 1 and 2 on the left must be kept for at least one year for all PCs.", "evidence": "① Log configuration screens\n① Logs (actual logs)", "article": "25(2)", "issue": "", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 77, "category": "7.Measures to prepare for incidents and failures", "name": "Backup acquisition and storage for important systems", "content": "For critical systems (including cloud services), are all of the following implemented?\n\n1. Backups are taken and stored at appropriate schedules and times using an appropriate generation policy\n2. Store backup data in a segment that is separate from the system to restrict communication with that system except for backup operations(*)\n \n*Including storage to a cloud backup service and physical storage using external storage media", "standard": "① All important systems must satisfy items 1 and 2 to the left\n② The frequency and method of backup must be appropriate in regard to the confidentiality and importance of stored information", "evidence": "①② Backup configuration screen, service specifications and backup design documents, and configuration information of devices such as routers and firewalls (FW) installed between segments", "article": "25(3)", "issue": "①,②", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 78, "category": "7.Measures to prepare for incidents and failures", "name": "Backup restore procedures for important systems", "content": "Are backup recovery procedures in place for important systems?", "standard": "① Must establish backup recovery procedures for all important systems", "evidence": "① Backup restore procedures", "article": "25(3)", "issue": "③", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 79, "category": "7.Measures to prepare for incidents and failures", "name": "Monitoring and handling of endpoint terminals", "content": "Has EDR (Endpoint Detection and Response) been implemented in a manner that satisfies \"Appendix 4: Detection Scenario List\" in order to collect and monitor endpoint logs in real-time and respond to threats when they are detected?", "standard": "① Any EDR products used must satisfy requirements listed in \"Appendix 4: Detection Scenario List\"", "evidence": "① Screenshots of management screens, etc.", "article": "26(1)", "issue": "", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 80, "category": "7.Measures to prepare for incidents and failures", "name": "Incident monitoring, analysis, and response organizations", "content": "Are the following implemented with regard to security event monitoring, analysis, and response?\n\n1. There is a 24 hour, 365 day monitoring/response team\n2. Either a) or b) applies to individuals responsible for monitoring and analysis\n　　a) Individuals with experience in SOC-related work\n　　b) Qualified IT security-related personnel with experience in IT security-related operations\n3. Individuals responsible for providing responses have experience in IT security-related work", "standard": "① Must ensure there is a 24 hour, 365 day response organization\n② Must include individuals mentioned in items 2 and 3 to the left for said organization are qualified (relevant qualifications include the following)\n• CEH (Certified Ethical Hacker)\n• GSEC/GCIH/GCIA: GIAC Security Certifications\n• CISSP (Certified Information Systems Security Professional)", "evidence": "① Organization charts\n② Member profiles (experience, skills, years of experience, etc.)", "article": "26(2)", "issue": "", "risk": "High", "priority": "〇", "qtype": "① System-related", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 81, "category": "7.Measures to prepare for incidents and failures", "name": "Log monitoring and correlation analysis", "content": "Are all of the following implemented with regard to log monitoring and analysis?\n\n1. Endpoint and network device logs are collected in real-time\n2. SIEM (Security Information and Event Management) has been implemented\n3. Standards have been established for analyzing detected logs and critical (requiring immediate action) logs are always reviewed\n4. Confirmation whether operations are being performed appropriately based on the standards above are conducted at least once per year", "standard": "① Must introduce SIEM products with the functionality indicated in item 1 to the left and \"Appendix 4: Detection Scenario List\"\n② Must store the results of reviews and audits described in items 3 and 4 to the left", "evidence": "① Screenshots of SIEM management screens, log analysis standards, etc.\n② Review / confirmation results (within most recent year)", "article": "26(1)\n26(3)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 82, "category": "7.Measures to prepare for incidents and failures", "name": "Rule modeling/tuning for SIEM, etc.", "content": "Are product detection/analysis rule modeling and tuning for SIEM, etc. performed based on the latest security threat information and for past over-detection or false detection incidents?", "standard": "① Must implement functionality to analyze correlation from multiple log sources and identify security threats, such as a SIEM function\n② Must tune rules as needed in a timely manner", "evidence": "① Screenshots of correlation analysis screens\n② Screenshots of rule configuration screens\n② Tuning history for rules (minutes of review meetings, etc.)", "article": "26(3)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 83, "category": "7.Measures to prepare for incidents and failures", "name": "Initial response time when malware is detected", "content": "When a threat such as malware is detected, is there a target response time set in advance (from when the alert is detected until the endpoint is isolated from the network)?", "standard": "① Must set an appropriate target response time from when detection occurs to when provisional measures are begun (approximately within three hours)\n ② The actual time from when detection occurs to when remediation begins must be within the target response time according to incident reports", "evidence": "① SLA/operation design documents, etc. (describing target response times)\n② Most recent incident response report", "article": "26(3)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 84, "category": "7.Measures to prepare for incidents and failures", "name": "Preparations for responding when a security incident occurs", "content": "In regard to responding to when a security incident is detected, has a response procedure been prepared that includes the following\n\n1. Initial actions and internal reports when an incident occurs; division of responsibilities, identification of scope of impact, etc.\n2. Procedures for isolating from authentication servers and distribution servers shared with neighboring networks or other companies to prevent the spread of damage (spread of malware infection, etc.)\n3. Report to M-CSIRT\n4. Report to Marubeni's main department", "standard": "① Must establish response procedures for items 1, 2, 3, and 4 to the left\n②Training based on the relevant response procedures (verification of whether the procedures can be implemented according to the procedures) should be conducted on a regular basis.", "evidence": "① Response procedure documents\n②Training record", "article": "26(4)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 85, "category": "7.Measures to prepare for incidents and failures", "name": "Reporting and responding when a security incident occurs", "content": "Are the following operations conducted in accordance with the \"Reporting Guideline for Security Incidents\" and the \"(same) Guideline for Response\"?\n\n1.Inform and implement reporting to the M-CSIRT and Marubeni's main department.\n2. All of the following responses are implemented and recorded in the incident report\n  1) Analysis/containment\n  2) Eradication/restoration\n  3) Prevention of recurrence", "standard": "① Disseminate the contents of 1 on the left.\n② Must implement items 1 and 2 to the left when an incident occurs and must record this in incident response reports", "evidence": "① Memos\n② Most recent incident response report", "article": "26(1)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 86, "category": "8.Handling of information assets", "name": "Security measures for file storage", "content": "Are all of the following implemented for file storage that includes confidential information (all information assets except public information or information that could be made public)?\n\n1. Access from the command line is controlled\n2. Two-factor authentication\n3. Controls are in place to prevent access using the AD administrator account (separate file storage administrator and AD administrator accounts)\n4. Recorded logs cannot be deleted or changed even by system administrators\n5. All files in storage are encrypted\n6. Communication with file storage is encrypted", "standard": "① File storage that is being used must satisfy items 1, 2, 3, 4, 5, and 6 to the left", "evidence": "① File storage configuration screens, service specifications, responses from vendors, etc.", "article": "30(3)", "issue": "ⅰ～ⅴ", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 87, "category": "8.Handling of information assets", "name": "Designation and dissemination of confidential information", "content": "Are information assets and their level of confidentiality, containing department, etc. listed as confidential information, and disseminated to employees?", "standard": "① Must inform employees of the list described to the left (reference material: Appendix 5_Information Asset Management Standards Sample)\n② Must periodically review list above", "evidence": "① Memos (rules, training materials, individual memos, etc.)\n② Records of reviews", "article": "9(2)\n30(1)\n30(2)", "issue": "①,②", "risk": "Very High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 88, "category": "8.Handling of information assets", "name": "Storage and saving of confidential information", "content": "Are all of the following implemented regarding storing and saving confidential information?\n\n1. In principle, store and save data in high-security file storage, not in PCs or external storage media.\n(In the event that a file server, etc., other than a high-security storage is used, the Information Manager must confirm that it does not contain confidential information.\n2. Strictly confidential information(*) is separately stored/saved in folders, etc. from other information assets.\n\n*An information asset that would have a serious impact on business management and operations, or information entities of clients if an information leakage was to occur (insider information, information related to fraud and noncompliance, highly confidential personal information, etc.)", "standard": "①Must inform employees of the left operation rule\n②Must provide dedicated storage areas by default for all strictly confidential information (folders, etc.)\n③ Highly secure file storage corresponding to the information in item number 86 must be used", "evidence": "①Evidence that informing employees of the statement left has been done\n② Screenshots of screens showing exclusive storage locations for strictly confidential information", "article": "30(1)", "issue": "①", "risk": "Very High", "priority": "", "qtype": "① System-related", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 89, "category": "8.Handling of information assets", "name": "Default access permissions for file storage", "content": "Are all of the following implemented with regard to access rights which is granted by default in strictly secure file storage?\n\n1. Strictly confidential information is restricted to certain employees of the managing department (officers, etc., in the department)\n2. Confidential information that is not highly confidential is restricted to employees in the managing department", "standard": "① Must set permissions satisfying items 1 and 2 to the left by default for all storage locations for confidential information (folders, etc.)\n② Highly secure file storage corresponding to the information in item number 86 must be used", "evidence": "① Screenshots of access permission configuration screens for folders", "article": "31(1)", "issue": "①,②", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 90, "category": "8.Handling of information assets", "name": "Individual permission approval and review", "content": "When it is unavoidable for business reasons to allow access to confidential information by those other than users provided with access permissions by default, are the following implemented to limit access to the minimum level necessary, and only temporarily?\n\n1. User accessible information assets, and operations (editing, downloading, etc.) can be limited\n2. Granted and changed with the approval of an Information Manager (at least once per month for post-approval)\n3. Permissions are reviewed at least twice per year and the results are reviwed and approved by an Information Manager", "standard": "① Must provide file storage with functionality to perform items 1, 2, and 3 to the left\n② Must store results for items 2 and 3 to the left", "evidence": "① Screenshots of screens for granting individual permissions, or service specifications, manuals, etc.\n② Approval/review records", "article": "31(1)", "issue": "①,②", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 91, "category": "8.Handling of information assets", "name": "Means of sharing confidential information outside the company", "content": "Is confidential digital information shared outside the company only with certain other organizations, etc., and stored/saved in highly secure file storage?\n(Sharing through email attachments is generally prohibited even if passwords are set and attachments are encrypted)", "standard": "① Must provide functionality (sharing links, etc.) to share data on file storage outside of the company\n② Must provide functionality to prevent external sharing via email attachments or implement equivalent operations manually\n③ Highly secure file storage corresponding to the information in item number 86 must be used", "evidence": "① Screenshots of sharing function screens (sharing links, etc.)\n② Screenshots of email attachment control function screens, or evidence that informing employees", "article": "33(2)", "issue": "①", "risk": "Very High", "priority": "", "qtype": "① System-related", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 92, "category": "8.Handling of information assets", "name": "Detection of removal of confidential information from file storage", "content": "Are the following operations, which have a high possibility of inappropriate removal from highly secure file storage, detected by logs, etc. and notified to Information Manager, and does the manager instruct the subordinate to take action as necessary?\n\n1. Granting access permissions to accounts that are highly likely to be for personal use (e.g., free email addresses)\n2. An external user downloading a large number of files in a short period of time", "standard": "① Must provide a system for file storage to immediately notify Information Managers when operations described in items 1 and 2 to the left are performed\n② Information Managers must store records of confirming these notifications\n③ Highly secure file storage corresponding to the information in item number 86 must be used", "evidence": "① Detection emails\n② Records of checking detection emails", "article": "32(3)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 93, "category": "8.Handling of information assets", "name": "Prevention of loss of crucial information, etc. in file storage", "content": "Are the following implemented to prevent the loss of confidential information and information that must stored for a certain period of time from file storage due to internal and external negligence, etc.?\n\n1. Functions are in place or used to prevent employees from completely deleting information, etc. (such as deleting information from the recycle bin)\n2. Functions are in place or used to prevent information, etc. from being deleted before the retention period expires", "standard": "① Must provide functionality to perform items 1 and 2 to the left, or must establish and disseminate operational procedures\n② Highly secure file storage corresponding to the information in item number 86 must be used", "evidence": "① Screenshots of configuration screens\n① Memos (when responding with operations)", "article": "30(3)", "issue": "②ⅰ,ⅱ", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 94, "category": "8.Handling of information assets", "name": "Measures to prevent leakage of confidential information", "content": "Are all of the following measures taken to prevent leakage of confidential information?\n\n1. All of the following measures are taken to prevent information leakage from high-security file storage due to unauthorized access by internal/external parties or negligence.\n 1) Functions are in place or used to restrict downloading, moving, and copying of individual files\n 2) Functions are in place or used to add digital watermarks to files\n2. As a general rule, the removal (including printing, creating other duplicates, or transferring data outside of the Company control) of confidential information in locations where there are many and unspecified people is prohibited; if required for business, keep removed confidential information to the minimum required for business purposes, and prevent information leaks (use snooping prevention filter, check surroundings, etc.) under approval from the Information Manager", "standard": "① Must provide functionality to restrict downloading, moving, and copying individual files by external users, or must implement equivalent operations\n② Equipped with a function (digital watermark, etc.) to prevent unauthorized removal, or to implement an operation equivalent to it.\n③ Inform all employees of the security measures described on the left\n④ Highly secure file storage corresponding to the information in item number 86 must be used", "evidence": "① Configuration screen screenshots, or service specifications, etc.\n② Screenshots of screens such as digital watermarks\n①②(If it is supported by operation) Memos\n③Memos", "article": "32(1)\n32(2)", "issue": "", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 95, "category": "8.Handling of information assets", "name": "Management of confidential documents", "content": "Are all of the following implemented for the management of paper documents, electromagnetic storage media, etc. containing confidential information?\n\n1.As a rule, store and save in a lockable place.\n2. When a document specified as strictly confidential is to be taken out of the office, evidence of such removal is managed using a ledger.", "standard": "① Must store confidential documents, etc. in locations that can be locked (safes, lockers, storehouses, etc.)\n②Must maintain a record of strictly confidential documents taken out of the office", "evidence": "① Photos of storage locations for confidential documents, etc.\n②A record of strictly confidential documents taken out of the office", "article": "30(1)\n32(4)", "issue": "②", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}, {"no": 96, "category": "8.Handling of information assets", "name": "Means of sharing confidential documents, etc.", "content": "Is a method that allows users and recipients of documents to be identified and for the transfer status to be confirmed, when sharing paper documents and electromagnetic storage media containing confidential information?", "standard": "① Must share confidential documents, etc. in a manner that allows handlers and recipients to be identified and to confirm the transfer status, etc. (registered mail, internal mail, hand delivery, etc.)", "evidence": "① Records sent by registered mail, internal mail, etc.", "article": "33(2)", "issue": "②", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 8, "catShort": "Handling of Info Assets", "catShortTh": "การจัดการสารสนเทศ"}];

const APPX = [{"n": 1, "title": "Rule Requirements", "titleTh": "ข้อกำหนดของระเบียบ (Rule Requirements)", "cat": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ", "relatedQ": [1, 2], "kind": "sections", "data": [{"header": "IT Security", "rows": [{"cat": "(1)General rules", "req": "①Scope of application: all employees ②Definition of IT security: includes confidentiality, integrity, and availability"}, {"cat": "(2)Information security governance", "req": "①Target person of IT Manager: organization, job title ②The duties of IT Manager: operation of systems and IT devices, maintaining IT security, response to incidents, failures ③Business use environment: prohibiting use of private environments for business use, restricting private use of company environments ④Inspection: Self-inspection of IT security establishment/operation, confirmation when introducing cloud services"}, {"cat": "(3)Personnel and physical security", "req": "①Training: regular information security training for employees, drills on targeted attack emails ②Security measures of offices, server rooms and data centers: entry/exit restrictions, locking"}, {"cat": "(4)Account management", "req": "①Account management procedures: registration/modification/deletion, periodic inventorying, and restricting shared accounts ②Access permissions procedure: Initial setting according to affiliation and  job title, judgment of grant / change / deletion (including inventory)  ③Account authentication:password strength, two-factor authentication, password management"}, {"cat": "(5)IT asset management and Measures for terminals", "req": "①IT asset management: Ledger management of IT equipment, software, and service  ②Measures for terminals: user authentication, prevents unauthorized configuration changes and function modifications, conceals recorded electronic information ③Operation of terminals: approval when taking out company-owned PCs with containing confidential information and using external storage media, response in case of theft or loss"}, {"cat": "(6)Measures for software and Virus/vulnerabirity", "req": "①Software/services used in business: Approval by IT manager, etc. ②Measures for virus/vulnerabirity: antivirus software installation / operation, security patches application"}, {"cat": "(7)Network control", "req": "①Company networks management and control: configuration management, network segment separation, monitoring between internal/external boundaries ②Measures of remote access: restricts access source terminals and connection destinations、two-factor authentication、restricting the downloading ③Using the Internet: web filtering, follows the information asset management rules when sending confidential information"}, {"cat": "(8)Measures for business systems and communication tools", "req": "①Measures of business system: measures for security risks, configuration management、concealing confidential information,controling the removal of information ②communication tools (email, chat tools, web conference tools, etc.) used in business: Approval by IT manager, etc., consideration of communication content"}, {"cat": "(9)Measures to prepare for incidents,failures,and disasters", "req": "①logs/backup: obtaining, storing, and monitoring ②When a security incident occurs: establishing response procedures, takeing preventive measuresafter ③When a disaster occurs: maintain system availability required to continue business"}]}, {"header": "Information Assets Management", "rows": [{"cat": "(1)Structure for management and promotion", "req": "①Target person of Information Manager: organization, job title ②The duties of Information Manager: Guidance to employees under the control, access permissions management, designation of confidential information, response in case of information leakage  ③Inspection: Self-inspections of  information asset management ④Outsourcing of confidential information management to a third-party: confirmation of compliance with confidential information management policy, determining the management status"}, {"cat": "(2)Definition / designation of confidential information", "req": "①Confidential information: information asset that must not be leaked to individuals other than specific parties or related parties. ②Strictly confidential information:information asset that could have a very serious impact on the company's management, business, or subjects of information (customers, etc.) in the event of a leak, etc. ③Strictly confidential information includes the following: ・Insider information ・Information related to misconduct and noncompliance Sensitive personal information of employees  External (customers’ or other) personal information ④Designation of confidential information / confidentiality classification: Information Manager defines considering legal regulations and contents of information assets, etc."}, {"cat": "(3)Storage and retention of information assets", "req": "①Electronic information in general: store/save in high-security storage  ② Digital information classified as highly confidential: Managed separately from other information assets, and the Information Manager periodically provides confirmation and guidance on the storage and retention of confidential information ③How confidential information is stored/saved and provides guidance: Information Manager regularly confirms  to those under their supervision"}, {"cat": "(4)Confidential information access management", "req": "①Restriction users with access to confidential information: those who need it for business ②Restriction users with access to strictly confidential information: extremely limited among employees ③When allowing individuals to access confidential information: approval is obtained from the Information Manager"}, {"cat": "(5)Prevention of leakage of information assets", "req": "① Handling confidential information in locations where there are many and unspecified people: Generally prohibited; if required for business, implement measures to prevent information leaks, and keep removed confidential information to the minimum required for business purposes after obtaining approval from the Information Manager."}, {"cat": "(6)Sharing of strictly confidential information", "req": "① General information assets: Do not use or provide outside the company without due cause.  ②For electronic information, when shareing strictly confidential information inside/outside the company or shareing other confidential information outside the company: generally store/save information assets on high-security storage ③In cases where information assets concerning the acquisition/loss of rights and obligations such as contracts are to be received: confirming the signature of a legitimate responsible person"}]}]}, {"n": 2, "title": "List of Password Requirements", "titleTh": "รายการข้อกำหนดรหัสผ่าน (Password Requirements)", "cat": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้", "relatedQ": [21, 22], "kind": "pwd", "data": [{"no": "1", "setting": "Length", "req": "12 characters or longer", "level": "Required", "sysctrl": "〇", "alt": "Both ① and ② below must be satisfied ① Length: 8 characters or longer ② Multifactor authentication Must satisfy all of the following if the above cannot be satisfied A) Monitor whether lock settings are released B) Prohibit automatic release after a certain period of time passes following erroneous input lock (user application required) C) Check with relevant users at least once per month to determine whether lock was due to erroneous input by said user"}, {"no": "2", "setting": "Complexity", "req": "Use at least three types of characters (uppercase letters, lowercase letters, numbers, and symbols)", "level": "Required", "sysctrl": "〇", "alt": "In order to ensure that deciphering will take a sufficiently long time during a brute force attack, a password must have 15 or more characters if only letters are used or a combination of letters and numbers (passwords consisting of numbers only or symbols only are not allowed)"}, {"no": "3", "setting": "Account locking after incorrect password entry", "req": "Lockout after 5 or fewer consecutive unsuccessful login attempts", "level": "Required", "sysctrl": "〇", "alt": "(N/A)"}, {"no": "", "setting": "", "req": "Do not automatically unlock the account after a certain period of time (user must request this be done)", "level": "Recommended", "sysctrl": "〇", "alt": "-"}, {"no": "4", "setting": "Character string restrictions", "req": "Educate users so they will not use the following character strings for their passwords ・Their user IDs, first and last names ・Repeating or sequential character strings ・Names of services or people, etc. ・Sequences of adjacent letters on the keyboard ・Characters contained in previously leaked passwords", "level": "Required", "sysctrl": "-", "alt": "(N/A)"}, {"no": "", "setting": "", "req": "Prohibit use of the character strings above in each system", "level": "Recommended", "sysctrl": "〇", "alt": "-"}, {"no": "5", "setting": "Reuse restrictions", "req": "Educate users so they will not reuse passwords", "level": "Required", "sysctrl": "-", "alt": "(N/A)"}, {"no": "", "setting": "", "req": "Specify the maximum number of generations that is manageable in each system", "level": "Recommended", "sysctrl": "〇", "alt": "-"}, {"no": "6", "setting": "Periodic password change*", "req": "General accounts: Not required", "level": "-", "sysctrl": "-", "alt": "-"}, {"no": "", "setting": "", "req": "Administrator accounts: Ensure that passwords must be changed within 3 months", "level": "Required", "sysctrl": "-", "alt": "(N/A)"}, {"no": "", "setting": "", "req": "Automated by system (such as requiring periodic changing on password only for OS/DB accounts)", "level": "Recommended", "sysctrl": "〇", "alt": "-"}, {"no": "7", "setting": "Storing", "req": "Do not hardcode passwords.", "level": "Required", "sysctrl": "-", "alt": "(N/A)"}, {"no": "", "settin function donut(segments,size,thick){
  size=size||150; thick=thick||26;
  const r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let total=segments.reduce((s,x)=>s+x.v,0)||1, off=0, parts='';
  segments.forEach(s=>{
    const len=C*s.v/total;
    parts+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="'+thick+'" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    off+=len;
  });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+parts+'</svg>';
}
function statusCounts(filterFn){
  const c={"Not Started":0,"In Progress":0,"Compliant":0,"Partial":0,"Not Applicable":0};
  ITEMS.filter(filterFn||(()=>true)).forEach(it=>{
    const st=(STATE[it.no]&&STATE[it.no].status)||"Not Started"; c[st]++;
  });
  return c;
}
function progressPct(filterFn){
  const arr=ITEMS.filter(filterFn||(()=>true));
  if(!arr.length) return 0;
  let done=0;
  arr.forEach(it=>{ const st=(STATE[it.no]&&STATE[it.no].status); if(st==="Compliant"||st==="Not Applicable") done++; else if(st==="Partial") done+=0.5; });
  return Math.round(done/arr.length*100);
}

    if(FILTERS.status){ const st=(STATE[it.no]&&STATE[it.no].status)||"Not Started"; if(st!==FILTERS.status) return false; }
    if(FILTERS.q){ const q=FILTERS.q.toLowerCase(); if(!((it.name+' '+it.content+' '+it.article).toLowerCase().includes(q))) return false; }

      ${thd(['No.','หมวดสารสนเทศ<div class="en text-[10px]">Category</div>','ชื่อสารสนเทศ<div class="en text-[10px]">Name of information asset</div>','ระดับชั้นความลับ<div class="en text-[10px]">Confidentiality level</div>','ระยะเวลาเก็บรักษา<div class="en text-[10px]">Retention period</div>'])}
      <tbody>${ap.data.map(r=>`<tr class="border-t border-slate-100 align-top text-xs">
        <td class="px-2 py-2 text-slate-400">${esc(r.no)}</td>
        <td class="px-2 py-2 font-medium text-slate-700">${esc(r.cat)}</td>
        <td class="px-2 py-2 text-slate-600">${esc(r.name)}</td>
        <td class="px-2 py-2"><span class="px-2 py-0.5 rounded-full whitespace-nowrap ${LEVEL_BG[r.level]||'bg-slate-100 text-slate-500'}">${esc(r.level)}</span></td>
        <td class="px-2 py-2 text-center text-slate-600">${esc(r.retention)||'-'}</td></tr>`).join('')}</tbody>
      </table></div>`;
  }
  return '';
}

// ---------- interactions ----------
function toggleRow(n){ EXPANDED[n]=!EXPANDED[n]; render(); }
function setField(n,k,v){ STATE[n]=STATE[n]||{}; STATE[n][k]=v; saveState(STATE); render(); }
function clearFilters(){ FILTERS={cat:"",risk:"",pri:"",status:"",type:"",q:""}; render(); }
function bind(){
  ['fcat','frisk','fpri','ftype','fstatus'].forEach(id=>{ const e=document.getElementById(id); if(e) e.onchange=()=>{ FILTERS[id.slice(1)]=e.value; render(); }; });
  const fq=document.getElementById('fq');
  if(fq) fq.oninput=()=>{ FILTERS.q=fq.value; render(); const n=document.getElementById('fq'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} };
}
render();
</script>
</body>
</html>
