<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Governance Dashboard — AutoCorp | ITGR Checklist FY2025</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Sarabun',system-ui,sans-serif;}
  .fade-in{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  ::-webkit-scrollbar{height:9px;width:9px;}
  ::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:6px;}
  ::-webkit-scrollbar-track{background:#e2e8f0;}

  @media print{.noprint{display:none!important;}}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div id="app"></div>
<script>
const RISK_ORDER = ["Very High","High","Middle","Low"];
const RISK_TH = {"Very High":"สูงมาก","High":"สูง","Middle":"ปานกลาง","Low":"ต่ำ","":"-"};
const RISK_COLOR = {"Very High":"#dc2626","High":"#ea580c","Middle":"#d97706","Low":"#0ea5e9","":"#94a3b8"};
const RISK_BG = {"Very High":"bg-red-100 text-red-700","High":"bg-orange-100 text-orange-700","Middle":"bg-amber-100 text-amber-700","Low":"bg-sky-100 text-sky-700","":"bg-slate-100 text-slate-500"};
// v1.3: "Not Applicable" is retired — the value is repurposed to mean
// "Not Compliant" (Approver's NC decision), per stakeholder decision in
// PRD.md. It no longer gets full credit in progressPct() below.
const STATUSES = ["Not Started","In Progress","Compliant","Partial","Not Compliant"];
const STATUS_TH = {"Not Started":"ยังไม่เริ่ม","In Progress":"กำลังดำเนินการ","Compliant":"สอดคล้อง","Partial":"สอดคล้องบางส่วน (มีเงื่อนไข)","Not Compliant":"ไม่ผ่าน"};
const STATUS_COLOR = {"Not Started":"#94a3b8","In Progress":"#2563eb","Compliant":"#16a34a","Partial":"#d97706","Not Compliant":"#dc2626"};
const STATUS_BG = {"Not Started":"bg-slate-100 text-slate-600","In Progress":"bg-blue-100 text-blue-700","Compliant":"bg-green-100 text-green-700","Partial":"bg-amber-100 text-amber-700","Not Compliant":"bg-red-100 text-red-700"};

// Workflow state (v1.3) — more granular than `status`; drives which
// action buttons the Tracker shows. `status` above stays the simple
// value the Overview/radar/grade calculations already understand.
const WF_TH = {
  "Not Started":"ยังไม่เริ่ม","In Progress":"กำลังดำเนินการ","Pending Review":"รอตรวจทาน",
  "Pending Approval":"รออนุมัติ","Rejected":"ถูกตีกลับ","Compliant":"สอดคล้อง",
  "Complied with Condition":"สอดคล้องมีเงื่อนไข","Not Compliant":"ไม่ผ่าน"
};
const WF_BG = {
  "Not Started":"bg-slate-100 text-slate-600","In Progress":"bg-blue-100 text-blue-700",
  "Pending Review":"bg-violet-100 text-violet-700","Pending Approval":"bg-indigo-100 text-indigo-700",
  "Rejected":"bg-red-100 text-red-700","Compliant":"bg-green-100 text-green-700",
  "Complied with Condition":"bg-amber-100 text-amber-700","Not Compliant":"bg-red-100 text-red-700"
};
// v1.4: Owner/Evidence lock once an item reaches one of these — reopen via
// "Request for Approval". ClickUp Task link is exempt, always editable.
const TERMINAL_WF = ["Compliant","Complied with Condition","Not Compliant"];
const GRADE_COLOR = {A:"#16a34a",B:"#0ea5e9",C:"#d97706",D:"#ea580c",E:"#dc2626"};
const GRADE_BG = {A:"bg-green-100 text-green-700",B:"bg-sky-100 text-sky-700",C:"bg-amber-100 text-amber-700",D:"bg-orange-100 text-orange-700",E:"bg-red-100 text-red-700"};
function gradeFor(pct){ return pct>=80?'A':pct>=60?'B':pct>=40?'C':pct>=20?'D':'E'; }

// All checklist/reference data + tracker state now lives in Supabase and is
// loaded through the BFF (/api/*) at startup — see init() at the bottom.
let ITEMS = [], DRIVE = [], APPX = [], STATE = {};
let ME = null; // { name, role } — set by init() after /api/me

function priTh(p){ return p==="◎"?"สูงสุด":(p==="〇"?"สำคัญ":"ปกติ"); }
function priEn(p){ return p==="◎"?"Top Priority":(p==="〇"?"Priority":"Standard"); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
// v1.3 role helpers — `user`/`reviewer`/`approver` replace the old
// `read_write` tier, each scoped to one stage of the approval workflow.
// `admin` can act at any stage (break-glass / cover for absence).
function isAdmin(){ return ME && ME.role==='admin'; }
function canEditItem(){ return ME && (ME.role==='admin' || ME.role==='user'); }
function canSubmit(){ return canEditItem(); }
function canReview(){ return ME && (ME.role==='admin' || ME.role==='reviewer'); }
function canApprove(){ return ME && (ME.role==='admin' || ME.role==='approver'); }

let CATS = [];
function rebuildCats(){
  CATS = [];
  ITEMS.forEach(it=>{ if(!CATS.find(c=>c.no===it.catNo)) CATS.push({no:it.catNo,full:it.category,short:it.catShort,shortTh:it.catShortTh}); });
  CATS.sort((a,b)=>a.no-b.no);
}

function donut(segments,size,thick){
  size=size||150; thick=thick||26;
  const r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let total=segments.reduce((s,x)=>s+x.v,0)||1, off=0, parts='';
  segments.forEach(s=>{
    const len=C*s.v/total;
    parts+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="'+thick+'" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    off+=len;
  });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+parts+'</svg>';
}
function radarChart(items,size){
  size=size||280;
  const n=items.length;
  const cx=size/2, cy=size/2, R=size/2-16;
  const angleFor=i=> -Math.PI/2 + i*(2*Math.PI/n);
  const ptAt=(i,frac)=>{ const a=angleFor(i); return [cx+Math.cos(a)*R*frac, cy+Math.sin(a)*R*frac]; };
  const rings=[0.2,0.4,0.6,0.8,1].map(lv=>{
    const pts=items.map((_,i)=>ptAt(i,lv).join(',')).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="#e2e8f0" stroke-width="1"></polygon>';
  }).join('');
  const axes=items.map((_,i)=>{
    const [x,y]=ptAt(i,1);
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#e2e8f0" stroke-width="1"></line>';
  }).join('');
  const dataPts=items.map((d,i)=>ptAt(i, Math.max(0,Math.min(1,d.pct/100))));
  const dataPoly='<polygon points="'+dataPts.map(p=>p.join(',')).join(' ')+'" fill="#2563eb26" stroke="#2563eb" stroke-width="2"></polygon>';
  const dots=items.map((d,i)=>{ const [x,y]=dataPts[i]; return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+GRADE_COLOR[d.grade]+'" stroke="#fff" stroke-width="1.5"></circle>'; }).join('');
  const tickLabels=items.map((d,i)=>{
    const [x,y]=ptAt(i,1.12);
    return '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#64748b">'+d.no+'</text>';
  }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+rings+axes+dataPoly+dots+tickLabels+'</svg>';
}
function statusCounts(filterFn){
  const c={"Not Started":0,"In Progress":0,"Compliant":0,"Partial":0,"Not Compliant":0};
  ITEMS.filter(filterFn||(()=>true)).forEach(it=>{
    const st=(STATE[it.no]&&STATE[it.no].status)||"Not Started"; c[st]++;
  });
  return c;
}
function progressPct(filterFn){
  const arr=ITEMS.filter(filterFn||(()=>true));
  if(!arr.length) return 0;
  let done=0;
  // Only Compliant counts full and Partial counts half — "Not Compliant"
  // (formerly "Not Applicable") must NOT get credit here, or a failed
  // item would silently inflate the compliance percentage.
  arr.forEach(it=>{ const st=(STATE[it.no]&&STATE[it.no].status); if(st==="Compliant") done++; else if(st==="Partial") done+=0.5; });
  return Math.round(done/arr.length*100);
}

let TAB="overview", FILTERS={cat:"",risk:"",pri:"",status:"",type:"",q:""}, EXPANDED={};
function setTab(t){ TAB=t; if(t==='admin' && isAdmin()) loadAdminData(); render(); }

function render(){
  const app=document.getElementById('app');
  app.innerHTML = header() + nav() + '<main class="max-w-7xl mx-auto px-4 pb-16 fade-in">'+(
    TAB==="overview"?overview(): TAB==="tracker"?tracker(): TAB==="category"?categoryView():
    TAB==="appendix"?appendixView(): TAB==="admin"?adminView(): reference()
  )+'</main>' + footer();
  bind();
}

function header(){
  return '<header class="bg-gradient-to-r from-blue-800 via-blue-700 to-sky-600 text-white">'
   +'<div class="max-w-7xl mx-auto px-4 py-6"><div class="flex items-center gap-3 flex-wrap justify-between">'
   +'<div class="flex items-center gap-3 flex-wrap">'
   +'<div class="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center text-2xl">\u{1F6E1}️</div>'
   +'<div><h1 class="text-xl sm:text-2xl font-bold leading-tight">แดชบอร์ดการกำกับดูแล IT — AutoCorp <span class="font-normal text-blue-100">/ IT Governance Dashboard</span></h1>'
   +'<p class="text-blue-100 text-sm">Marubeni Group IT Governance Rules (ITGR) Checklist · FY2025 Ver.1 · ปรับปรุง 1 เม.ย. 2025 / Updated 1 Apr 2025</p>'
   +'</div></div>'
   +(ME?'<div class="text-right text-sm noprint"><div class="font-medium">'+esc(ME.name)+'</div><div class="text-blue-200 text-xs">'+roleLabel(ME.role)+'</div><button onclick="logout()" class="mt-1 text-xs px-2 py-1 rounded-lg bg-white/15 hover:bg-white/25">ออกจากระบบ / Logout</button></div>':'')
   +'</div></div></header>';
}
function roleLabel(r){
  return {
    admin:'ผู้ดูแลระบบ / Admin',
    user:'ผู้เตรียมข้อมูล / User',
    reviewer:'ผู้ตรวจทาน / Reviewer',
    approver:'ผู้อนุมัติ / Approver',
    read_only:'อ่านอย่างเดียว / Read-Only'
  }[r] || r;
}
// Items waiting on the current user's action — drives the nav badge.
function pendingForMe(){
  if(!ME) return 0;
  if(ME.role==='reviewer') return ITEMS.filter(it=>(STATE[it.no]&&STATE[it.no].workflowState)==='Pending Review').length;
  if(ME.role==='approver') return ITEMS.filter(it=>(STATE[it.no]&&STATE[it.no].workflowState)==='Pending Approval').length;
  if(ME.role==='user') return ITEMS.filter(it=>(STATE[it.no]&&STATE[it.no].workflowState)==='Rejected').length;
  if(ME.role==='admin') return ITEMS.filter(it=>['Pending Review','Pending Approval'].includes(STATE[it.no]&&STATE[it.no].workflowState)).length;
  return 0;
}
function nav(){
  const tabs=[
    ["overview","\u{1F4CA} ภาพรวม","Overview"],
    ["tracker","✅ รายการติดตาม","Checklist Tracker"],
    ["category","\u{1F5C2}️ รายหมวด","By Category"],
    ["appendix","\u{1F4D1} ภาคผนวก","Appendix 1–5"],
    ["reference","\u{1F4DA} คลังเอกสารอ้างอิง","Reference Library"]];
  if(isAdmin()) tabs.push(["admin","\u{1F512} ผู้ดูแลระบบ","Admin"]);
  const pending=pendingForMe();
  return '<div class="bg-blue-900 noprint"><div class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto">'+
    tabs.map(t=>'<button onclick="setTab(\''+t[0]+'\')" class="tabbtn relative '+(TAB===t[0]?'active':'text-blue-100 hover:bg-blue-800')+' px-4 py-2 text-sm font-medium rounded-t-lg whitespace-nowrap transition leading-tight text-left">'
      +t[1]+(t[0]==='tracker'&&pending>0?' <span class="inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold align-middle">'+pending+'</span>':'')
      +'<span class="block text-[10px] '+(TAB===t[0]?'text-blue-400':'text-blue-300/70')+' font-normal">'+t[2]+'</span></button>').join('')
  +'</div></div>';
}
function footer(){
  return '<footer class="border-t border-slate-200 bg-white"><div class="max-w-7xl mx-auto px-4 py-4 text-xs text-slate-400">'
   +'แหล่งข้อมูล / Source: (Autocorp) IT Governance Rules Checklist_Eng.xlsx · Google Drive "IT DD 2025" · จัดทำโดย / Prepared by ITGR Advisor<br>'
   +'ข้อมูลทั้งหมดจัดเก็บบน Supabase และซิงก์แบบเรียลไทม์ระหว่างผู้ใช้ / All data is stored in Supabase and shared across all users'
   +'</div></footer>';
}
function H(th,en){ return th+' <span class="en text-sm">/ '+en+'</span>'; }

// ---------- OVERVIEW ----------
function overview(){
  const total=ITEMS.length;
  const riskC={}; RISK_ORDER.forEach(r=>riskC[r]=ITEMS.filter(i=>i.risk===r).length);
  const sc=statusCounts(); const pct=progressPct();
  const topPri=ITEMS.filter(i=>i.priority==="◎").length;
  const pri=ITEMS.filter(i=>i.priority==="〇").length;
  const kpi=(th,en,val,sub,color)=>`<div class="bg-white rounded-xl border border-slate-200 p-4">
     <div class="text-3xl font-bold" style="color:${color}">${val}</div>
     <div class="text-sm font-semibold text-slate-700 mt-1 leading-tight">${th}</div>
     <div class="text-[11px] text-slate-400 leading-tight">${en}</div>
     <div class="text-xs text-slate-400 mt-1">${sub}</div></div>`;
  const riskSeg=RISK_ORDER.map(r=>({v:riskC[r],c:RISK_COLOR[r]}));
  const statusSeg=STATUSES.map(s=>({v:sc[s],c:STATUS_COLOR[s]}));
  const catBars=CATS.map(c=>{
    const n=ITEMS.filter(i=>i.catNo===c.no).length;
    const p=progressPct(i=>i.catNo===c.no);
    return `<div class="mb-2.5">
      <div class="flex justify-between text-xs mb-1"><span class="font-medium text-slate-600">${c.no}. ${esc(c.shortTh)} <span class="en">/ ${esc(c.short)}</span></span><span class="text-slate-400">${p}% · ${n} ข้อ</span></div>
      <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${p}%;background:linear-gradient(90deg,#2563eb,#0ea5e9)"></div></div>
    </div>`;
  }).join('');
  return `
  <section class="mt-6">
    <div class="bg-white rounded-xl border border-slate-200 p-5 mb-6">
      <h2 class="text-lg font-bold text-blue-800 mb-2">บทสรุปผู้บริหาร <span class="en text-base">/ Executive Summary</span></h2>
      <p class="text-sm text-slate-600 leading-relaxed mb-2">
        <b>[TH]</b> แดชบอร์ดนี้ใช้ติดตามและควบคุมการปฏิบัติตาม <b>Marubeni Group IT Governance Rules (ITGR) Checklist FY2025</b>
        ซึ่งประกอบด้วย <b>${total} ข้อคำถาม</b> ใน <b>${CATS.length} หมวด</b> ครอบคลุมการกำกับดูแลความมั่นคงปลอดภัยสารสนเทศ การจัดการบัญชีผู้ใช้
        การจัดการสินทรัพย์ IT ซอฟต์แวร์และการป้องกันไวรัส การควบคุมเครือข่าย ระบบงานทางธุรกิจ การเตรียมพร้อมรับเหตุการณ์ และการจัดการสารสนเทศ
        แต่ละข้อกำหนดถูกจัดระดับความเสี่ยงและระดับความสำคัญ ทีม COE&S สามารถบันทึกสถานะการปฏิบัติ ผู้รับผิดชอบ และหมายเหตุของแต่ละข้อได้ในแท็บรายการติดตาม
      </p>
      <p class="text-sm text-slate-500 leading-relaxed">
        <b>[EN]</b> This dashboard tracks and controls compliance with the <b>Marubeni Group IT Governance Rules (ITGR) Checklist FY2025</b>,
        comprising <b>${total} questions</b> across <b>${CATS.length} categories</b> — covering information security governance, account management,
        IT asset management, software & anti-virus, network control, business systems, incident preparedness and handling of information assets.
        Each requirement carries a risk and priority rating; the COE&S team records implementation status, owner and notes in the Checklist Tracker tab.
      </p>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
      ${kpi("ข้อกำหนดทั้งหมด","Total Requirements",total,CATS.length+" หมวด / categories","#1d4ed8")}
      ${kpi("ความเสี่ยงสูงมาก","Very High Risk",riskC["Very High"],"ระดับสูงสุด / highest","#dc2626")}
      ${kpi("ลำดับความสำคัญสูงสุด","Top Priority ◎",topPri,"+ สำคัญ / Priority 〇 "+pri,"#ea580c")}
      ${kpi("สอดคล้องแล้ว","Compliant",sc["Compliant"],"ผ่านการตรวจสอบ / verified","#16a34a")}
      ${kpi("ความคืบหน้ารวม","Overall Progress",pct+"%",sc["Not Started"]+" ยังไม่เริ่ม / not started","#0ea5e9")}
    </div>
    <div class="grid lg:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="font-bold text-slate-700 mb-3 text-sm">${H("การกระจายตามระดับความเสี่ยง","Risk Distribution")}</h3>
        <div class="flex items-center gap-4">
          <div class="relative">${donut(riskSeg,140,24)}
            <div class="absolute inset-0 flex flex-col items-center justify-center"><div class="text-2xl font-bold text-slate-700">${total}</div><div class="text-[10px] text-slate-400">ข้อ / items</div></div>
          </div>
          <div class="text-xs space-y-1.5">${RISK_ORDER.map(r=>`<div class="flex items-center gap-2"><span class="w-3 h-3 rounded shrink-0" style="background:${RISK_COLOR[r]}"></span><span class="text-slate-600">${RISK_TH[r]} <span class="en">/ ${r}</span></span><b class="text-slate-700">${riskC[r]}</b></div>`).join('')}</div>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="font-bold text-slate-700 mb-3 text-sm">${H("สถานะการปฏิบัติ","Compliance Status")}</h3>
        <div class="flex items-center gap-4">
          <div class="relative">${donut(statusSeg,140,24)}
            <div class="absolute inset-0 flex flex-col items-center justify-center"><div class="text-2xl font-bold text-blue-700">${pct}%</div><div class="text-[10px] text-slate-400">progress</div></div>
          </div>
          <div class="text-xs space-y-1.5">${STATUSES.map(s=>`<div class="flex items-center gap-2"><span class="w-3 h-3 rounded shrink-0" style="background:${STATUS_COLOR[s]}"></span><span class="text-slate-600">${STATUS_TH[s]} <span class="en">/ ${s}</span></span><b class="text-slate-700">${sc[s]}</b></div>`).join('')}</div>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="font-bold text-slate-700 mb-3 text-sm">${H("ความคืบหน้ารายหมวด","Progress by Category")}</h3>
        ${catBars}
      </div>
    </div>
    ${priorityGradeSection(pct)}
    ${radarSection()}
  </section>`;
}
function priorityGradeSection(overallPct){
  const overallGrade=gradeFor(overallPct);
  const tiers=[
    {mark:'◎',label:'สูงสุด',labelEn:'Top Priority ◎',filter:i=>i.priority==='◎'},
    {mark:'〇',label:'สำคัญ',labelEn:'Priority 〇',filter:i=>i.priority==='〇'}
  ];
  const tierCards=tiers.map(t=>{
    const arr=ITEMS.filter(t.filter);
    if(!arr.length) return `<div class="flex-1 min-w-[220px] border border-slate-100 rounded-lg p-3">
      <div class="text-sm font-bold text-slate-700 mb-2">${t.label} <span class="en">/ ${t.labelEn}</span></div>
      <div class="text-xs text-slate-300 italic">— ไม่มีข้อกำหนดในกลุ่มนี้ / no items in this tier —</div>
    </div>`;
    const p=progressPct(t.filter);
    const g=gradeFor(p);
    const sc=statusCounts(t.filter);
    const statusRow=STATUSES.filter(s=>sc[s]).map(s=>`<span class="text-[10px] px-2 py-0.5 rounded-full ${STATUS_BG[s]}">${STATUS_TH[s]}/${s} ${sc[s]}</span>`).join('');
    return `<div class="flex-1 min-w-[220px] border border-slate-100 rounded-lg p-3">
      <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
        <div class="text-sm font-bold text-slate-700">${t.label} <span class="en">/ ${t.labelEn}</span></div>
        <div class="flex items-center gap-1.5">
          <b class="text-sm px-2 py-0.5 rounded ${GRADE_BG[g]}">${g}</b>
          <span class="text-slate-400 text-xs">${p}% · ${arr.length} ข้อ / items</span>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5">${statusRow}</div>
    </div>`;
  }).join('');
  return `<div class="bg-white rounded-xl border border-slate-200 p-5 mt-4">
    <h3 class="font-bold text-slate-700 mb-1 text-sm">${H("เกรดรวมทุกหมวด และสถานะตามลำดับความสำคัญ","Overall Grade & Priority Status")}</h3>
    <p class="text-[11px] text-slate-400 mb-3">เกรดรวมคำนวณจาก % ความคืบหน้าโดยรวมทั้ง 96 ข้อ (เกณฑ์เดียวกับกราฟเรดาร์ด้านล่าง) <span class="en block">/ Overall grade uses the same progress % and thresholds as the radar chart below, across all 96 items</span></p>
    <div class="flex flex-wrap gap-4 items-stretch">
      <div class="flex items-center gap-4 border border-slate-100 rounded-lg p-3 shrink-0">
        <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-bold text-white shrink-0" style="background:${GRADE_COLOR[overallGrade]}">${overallGrade}</div>
        <div>
          <div class="text-xs text-slate-400 leading-tight">เกรดรวม (8 หมวด) <span class="en block">/ Overall grade (all 8 categories)</span></div>
          <div class="text-2xl font-bold text-slate-700">${overallPct}%</div>
        </div>
      </div>
      ${tierCards}
    </div>
  </div>`;
}
function radarSection(){
  const radarData=CATS.map(c=>{
    const pct=progressPct(i=>i.catNo===c.no);
    return {no:c.no, shortTh:c.shortTh, short:c.short, pct, grade:gradeFor(pct)};
  });
  const legend=radarData.map(d=>`<div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded shrink-0" style="background:${GRADE_COLOR[d.grade]}"></span>
      <span class="text-slate-600">${d.no}. ${esc(d.shortTh)} <span class="en">/ ${esc(d.short)}</span></span>
      <span class="ml-auto flex items-center gap-1.5 shrink-0">
        <b class="text-xs px-1.5 py-0.5 rounded ${GRADE_BG[d.grade]}">${d.grade}</b>
        <span class="text-slate-400 text-xs w-9 text-right">${d.pct}%</span>
      </span>
    </div>`).join('');
  return `<div class="bg-white rounded-xl border border-slate-200 p-5 mt-4">
    <h3 class="font-bold text-slate-700 mb-1 text-sm">${H("เกรดความสอดคล้องรายหมวด (เรดาร์)","Category Compliance Grade (Radar)")}</h3>
    <p class="text-[11px] text-slate-400 mb-3">เกรดคำนวณจาก % ความคืบหน้าเดียวกับกราฟด้านบน — A ≥80% · B ≥60% · C ≥40% · D ≥20% · E &lt;20% <span class="en block">/ Grade uses the same progress % as the bars above — A ≥80% · B ≥60% · C ≥40% · D ≥20% · E &lt;20%</span></p>
    <div class="flex flex-wrap items-center gap-6">
      <div class="shrink-0 mx-auto">${radarChart(radarData,280)}</div>
      <div class="flex-1 min-w-[240px] text-xs space-y-2">${legend}</div>
    </div>
  </div>`;
}

// ---------- TRACKER ----------
function tracker(){
  let arr=ITEMS.filter(it=>{
    if(FILTERS.cat && it.catNo!=+FILTERS.cat) return false;
    if(FILTERS.risk && it.risk!==FILTERS.risk) return false;
    if(FILTERS.pri && it.priority!==FILTERS.pri) return false;
    if(FILTERS.type && !it.qtype.startsWith(FILTERS.type)) return false;
    if(FILTERS.status){ const st=(STATE[it.no]&&STATE[it.no].status)||"Not Started"; if(st!==FILTERS.status) return false; }
    if(FILTERS.q){ const q=FILTERS.q.toLowerCase(); if(!((it.name+' '+it.content+' '+it.article).toLowerCase().includes(q))) return false; }
    return true;
  });
  const sel=(id,opts,val,ph)=>`<select id="${id}" class="text-xs border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
    <option value="">${ph}</option>${opts.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  const editable=canEditItem();
  const rows=arr.map(it=>{
    const s=STATE[it.no]||{};
    const st=s.status||"Not Started";
    const wf=s.workflowState||"Not Started";
    const owner=s.owner||"";
    const note=s.note||"";
    const clickupUrl=s.clickupUrl||"";
    const open=EXPANDED[it.no];
    const statusCell=`<span class="text-[11px] px-2 py-1 rounded-full font-medium inline-block ${STATUS_BG[st]}">${STATUS_TH[st]} / ${st}</span>`
      +(['Pending Review','Pending Approval','Rejected'].includes(wf)
        ?`<div class="mt-1"><span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${WF_BG[wf]}">${WF_TH[wf]}</span></div>`:'')
      +(isAdmin()?`<div class="mt-1"><select onchange="setField(${it.no},'status',this.value)" class="text-[10px] border border-slate-200 rounded px-1 py-0.5 bg-white">
          ${STATUSES.map(s2=>`<option value="${s2}" ${s2===st?'selected':''}>${s2}</option>`).join('')}</select></div>`:'');
    const locked=TERMINAL_WF.includes(wf) && !isAdmin();
    const canEditFields=editable && !locked;
    const ownerField=canEditFields
      ?`<input value="${esc(owner)}" onchange="setField(${it.no},'owner',this.value)" placeholder="ระบุชื่อ / หน่วยงาน — Name / Unit" class="w-full mt-1 text-sm border border-slate-300 rounded-lg px-2 py-1.5">`
      :`<div class="w-full mt-1 text-sm text-slate-600">${esc(owner)||'<span class="text-slate-300">—</span>'}</div>`;
    const noteField=canEditFields
      ?`<input value="${esc(note)}" onchange="setField(${it.no},'note',this.value)" placeholder="บันทึกหลักฐาน / Gap / Action" class="w-full mt-1 text-sm border border-slate-300 rounded-lg px-2 py-1.5">`
      :`<div class="w-full mt-1 text-sm text-slate-600">${esc(note)||'<span class="text-slate-300">—</span>'}</div>`;
    const clickupField=`<div class="flex gap-1.5 items-center mt-1">
        ${editable?`<input id="cu-${it.no}" value="${esc(clickupUrl)}" onchange="setField(${it.no},'clickupUrl',this.value)" placeholder="https://app.clickup.com/t/..." class="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5">`
          :`<div class="w-full text-sm text-slate-600">${esc(clickupUrl)||'<span class="text-slate-300">—</span>'}</div>`}
        ${clickupUrl?`<a href="${esc(clickupUrl)}" target="_blank" rel="noopener" title="เปิดใน ClickUp / Open in ClickUp" class="shrink-0 text-xs px-2 py-1.5 rounded-lg bg-violet-100 hover:bg-violet-200 text-violet-700">\u{1F517}</a>`:''}
      </div>`;
    return `<tbody class="border-b border-slate-100">
      <tr class="hover:bg-blue-50/40">
        <td class="px-2 py-2 text-center"><button onclick="toggleRow(${it.no})" class="text-blue-600 font-bold w-5">${open?'−':'+'}</button></td>
        <td class="px-2 py-2 text-center text-slate-400 text-xs">${it.no}</td>
        <td class="px-2 py-2 text-xs text-slate-500 min-w-[130px]">${it.catNo}. ${esc(it.catShortTh)}<div class="en text-[10px]">${esc(it.catShort)}</div></td>
        <td class="px-2 py-2 text-sm text-slate-700 font-medium min-w-[220px]">${esc(it.name)}</td>
        <td class="px-2 py-2 text-center"><span class="text-[11px] px-2 py-0.5 rounded-full ${RISK_BG[it.risk]} whitespace-nowrap inline-block leading-tight">${RISK_TH[it.risk]||'-'}<br><span class="text-[9px] opacity-70">${it.risk||''}</span></span></td>
        <td class="px-2 py-2 text-center text-xs">${it.priority==='◎'?'<span title="สูงสุด / Top Priority" class="text-orange-600 font-bold">◎</span>':(it.priority==='〇'?'<span title="สำคัญ / Priority" class="text-blue-600">〇</span>':'<span class="text-slate-300">–</span>')}</td>
        <td class="px-2 py-2 text-center text-xs text-slate-400 whitespace-nowrap">§${esc(it.article)}</td>
        <td class="px-2 py-2 text-center">${statusCell}</td>
      </tr>
      ${open?`<tr class="bg-slate-50"><td colspan="8" class="px-6 py-4">
        <div class="grid md:grid-cols-2 gap-4 text-sm">
          <div><div class="text-xs font-bold text-blue-700 mb-1">เนื้อหาคำถาม <span class="en">/ Question content</span></div><div class="text-slate-600 whitespace-pre-line">${esc(it.content)}</div></div>
          <div><div class="text-xs font-bold text-blue-700 mb-1">เกณฑ์การพิจารณาว่าได้ดำเนินมาตรการแล้ว <span class="en">/ Standards to determine measures implemented</span></div><div class="text-slate-600 whitespace-pre-line">${esc(it.standard)||'<span class="text-slate-300">—</span>'}</div></div>
          <div><div class="text-xs font-bold text-blue-700 mb-1">หลักฐานยืนยัน <span class="en">/ Confirmation evidence</span></div><div class="text-slate-600 whitespace-pre-line">${esc(it.evidence)||'<span class="text-slate-300">—</span>'}</div></div>
          <div><div class="text-xs font-bold text-blue-700 mb-1">รายละเอียดข้อกำหนด <span class="en">/ Requirement details</span></div>
            <div class="text-slate-600 text-xs space-y-0.5">
              <div>หมวด / Category: <b>${it.catNo}. ${esc(it.catShortTh)} / ${esc(it.catShort)}</b></div>
              <div>ITGR Article/Paragraph: <b>§${esc(it.article)}</b></div>
              <div>ความเสี่ยง / Risk: <b>${RISK_TH[it.risk]||'-'} / ${it.risk||'-'}</b> · ลำดับความสำคัญ / Priority: <b>${priTh(it.priority)} / ${priEn(it.priority)}</b></div>
              <div>ประเภทคำถาม / Question Type: <b>${esc(it.qtype)}</b></div>
              ${it.issue?`<div>Issue: <b>${esc(it.issue)}</b></div>`:''}
            </div>
          </div>
        </div>
        <div class="grid md:grid-cols-3 gap-3 mt-4 pt-3 border-t border-slate-200">
          <div><label class="text-xs font-bold text-slate-500">ผู้รับผิดชอบ <span class="en">/ Owner</span></label>${ownerField}</div>
          <div><label class="text-xs font-bold text-slate-500">หมายเหตุ / หลักฐานอ้างอิง <span class="en">/ Note · Evidence</span></label>${noteField}</div>
          <div><label class="text-xs font-bold text-slate-500">งาน ClickUp <span class="en">/ Task (ClickUp)</span></label>${clickupField}</div>
        </div>
        ${locked&&editable?'<div class="text-[11px] text-amber-600 mt-2">\u{1F512} รายการนี้อนุมัติแล้ว — แก้ไข Owner/Evidence ไม่ได้จนกว่าจะกด "ส่งขออนุมัติใหม่" ด้านล่าง / This item is decided — Owner/Evidence are locked until you click "Request for Approval" below.</div>':''}
        ${workflowPanel(it,wf)}
        <div class="mt-3 pt-3 border-t border-slate-200">
          <button onclick="toggleHistory(${it.no})" class="text-xs text-blue-600 hover:underline">${EXPANDED_HISTORY[it.no]?'ซ่อนประวัติ / Hide history':'\u{1F553} ดูประวัติ / View history'}</button>
          ${EXPANDED_HISTORY[it.no]?historyPanel(it.no):''}
        </div>
        <div class="text-[10px] text-slate-300 mt-2">หมายเหตุ: เนื้อหาข้อกำหนด ITGR คงไว้เป็นภาษาอังกฤษตามต้นฉบับทางการ / ITGR requirement text is kept in the official English source.</div>
      </td></tr>`:''}
    </tbody>`;
  }).join('');
  return `<section class="mt-6">
    ${editable?'':trackerRoleBanner()}
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4 noprint">
      <div class="flex flex-wrap gap-2 items-center">
        <input id="fq" value="${esc(FILTERS.q)}" placeholder="\u{1F50D} ค้นหา ชื่อข้อ / เนื้อหา / Article — Search" class="text-xs border border-slate-300 rounded-lg px-3 py-1.5 flex-1 min-w-[220px]">
        ${sel('fcat',CATS.map(c=>[c.no,c.no+'. '+c.shortTh+' / '+c.short]),FILTERS.cat,'ทุกหมวด / All categories')}
        ${sel('frisk',RISK_ORDER.map(r=>[r,RISK_TH[r]+' / '+r]),FILTERS.risk,'ทุกระดับความเสี่ยง / All risk')}
        ${sel('fpri',[['◎','◎ สูงสุด / Top Priority'],['〇','〇 สำคัญ / Priority']],FILTERS.pri,'ทุกลำดับความสำคัญ / All priority')}
        ${sel('ftype',[['①','① System-related'],['②-1','②-1 Operations (significant)'],['②-2','②-2 Operations (other)']],FILTERS.type,'ทุกประเภทคำถาม / All types')}
        ${sel('fstatus',STATUSES.map(s=>[s,STATUS_TH[s]+' / '+s]),FILTERS.status,'ทุกสถานะ / All status')}
        <button onclick="clearFilters()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600">ล้างตัวกรอง / Clear</button>
        <button onclick="window.print()" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white">\u{1F5A8}️ พิมพ์ / Print · PDF</button>
      </div>
      <div class="text-xs text-slate-400 mt-2">แสดง / Showing <b class="text-slate-600">${arr.length}</b> จาก / of ${ITEMS.length} ข้อ / items</div>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto">
      <table class="w-full text-left">
        <thead><tr class="bg-blue-800 text-white text-xs align-bottom">
          <th class="px-2 py-2 w-8"></th>
          <th class="px-2 py-2">No</th>
          <th class="px-2 py-2">หมวด<div class="en text-[10px]">Category</div></th>
          <th class="px-2 py-2">ชื่อข้อกำหนด<div class="en text-[10px]">Requirement (EN source)</div></th>
          <th class="px-2 py-2 text-center">ความเสี่ยง<div class="en text-[10px]">Risk</div></th>
          <th class="px-2 py-2 text-center">สำคัญ<div class="en text-[10px]">Pri</div></th>
          <th class="px-2 py-2 text-center">Article</th>
          <th class="px-2 py-2 text-center">สถานะ<div class="en text-[10px]">Status</div></th>
        </tr></thead>
        ${rows||'<tbody><tr><td colspan="8" class="text-center text-slate-400 py-10 text-sm">ไม่พบข้อกำหนดที่ตรงกับตัวกรอง / No requirements match the filters</td></tr></tbody>'}
      </table>
    </div>
  </section>`;
}

function trackerRoleBanner(){
  const msg={
    reviewer:'คุณเป็น Reviewer — ตรวจทานรายการที่ "รอตรวจทาน" ได้ (คลิกเปิดรายการ) แก้ไข Owner/Evidence/Task ไม่ได้ / You are a Reviewer — you can review items in "Pending Review" (expand a row), but cannot edit Owner/Evidence/Task.',
    approver:'คุณเป็น Approver — ตัดสินรายการที่ "รออนุมัติ" ได้ (คลิกเปิดรายการ) แก้ไข Owner/Evidence/Task ไม่ได้ / You are an Approver — you can decide items in "Pending Approval" (expand a row), but cannot edit Owner/Evidence/Task.',
    read_only:'คุณมีสิทธิ์อ่านอย่างเดียว ไม่สามารถแก้ไขหรือดำเนินการใดๆ ได้ / You have read-only access — nothing here can be edited or actioned.'
  }[ME&&ME.role] || '';
  return msg?`<div class="bg-amber-50 border border-amber-200 text-amber-700 text-xs rounded-xl p-3 mb-4">${msg}</div>`:'';
}
function workflowPanel(it,wf){
  const no=it.no;
  if(canSubmit() && ['Not Started','In Progress','Rejected'].includes(wf)){
    return `<div class="mt-3 pt-3 border-t border-slate-200 bg-blue-50/60 -mx-6 px-6 py-3">
      <button onclick="submitItem(${no})" class="text-sm px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium">\u{1F4E4} ส่งขออนุมัติ / Submit for Approval</button>
      <div class="text-[11px] text-slate-400 mt-1">ต้องกรอกผู้รับผิดชอบและหมายเหตุ/หลักฐานก่อนส่ง / Owner and Evidence note are required before submitting</div>
    </div>`;
  }
  if(canReview() && wf==='Pending Review'){
    return `<div class="mt-3 pt-3 border-t border-slate-200 bg-violet-50/60 -mx-6 px-6 py-3">
      <div class="text-xs font-bold text-violet-700 mb-2">\u{1F441}️ การตรวจทาน / Reviewer action</div>
      <textarea id="rc-${no}" rows="2" placeholder="ความเห็น (จำเป็นถ้าตีกลับ) / Comment (required if rejecting)" class="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5 mb-2"></textarea>
      <div class="flex flex-wrap gap-2">
        <button onclick="reviewItem(${no},'ok')" class="text-sm px-3 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white font-medium">✓ OK → ส่งต่อผู้อนุมัติ / to Approver</button>
        <button onclick="reviewItem(${no},'reject')" class="text-sm px-3 py-1.5 rounded-lg bg-red-100 hover:bg-red-200 text-red-700 font-medium">✕ ตีกลับ / Reject</button>
      </div>
    </div>`;
  }
  if(canApprove() && wf==='Pending Approval'){
    return `<div class="mt-3 pt-3 border-t border-slate-200 bg-indigo-50/60 -mx-6 px-6 py-3">
      <div class="text-xs font-bold text-indigo-700 mb-2">\u{2696}️ การอนุมัติ / Approver decision</div>
      <textarea id="ac-${no}" rows="2" placeholder="ความเห็น / เงื่อนไขข้อยกเว้น — Comment / exception note" class="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5 mb-2"></textarea>
      <input id="af-${no}" type="file" multiple class="text-xs mb-2 block">
      <div class="flex flex-wrap gap-2">
        <button onclick="approveItem(${no},'compliant')" class="text-sm px-3 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white font-medium">✓ Compliant</button>
        <button onclick="approveItem(${no},'complied_with_condition')" class="text-sm px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white font-medium">△ Complied with Condition</button>
        <button onclick="approveItem(${no},'not_compliant')" class="text-sm px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium">✕ Not Compliant</button>
        <button onclick="approveItem(${no},'reject')" class="text-sm px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium">↩ ตีกลับให้ User / Reject</button>
      </div>
      <div class="text-[11px] text-slate-400 mt-1">"Complied with Condition" ต้องมีไฟล์แนบหรือ comment อย่างน้อย 1 อย่าง / requires at least an attached file or a comment</div>
    </div>`;
  }
  if(['Pending Review','Pending Approval'].includes(wf)){
    return `<div class="mt-3 pt-3 border-t border-slate-200 text-xs text-slate-400">${wf==='Pending Review'?'รอ Reviewer ตรวจทาน / Awaiting Reviewer':'รอ Approver อนุมัติ / Awaiting Approver'}</div>`;
  }
  if(wf==='Rejected'){
    return `<div class="mt-3 pt-3 border-t border-slate-200 text-xs text-red-500">รายการนี้ถูกตีกลับ — ดูสาเหตุในประวัติด้านล่าง / This item was rejected — see the reason in History below</div>`;
  }
  if(canSubmit() && TERMINAL_WF.includes(wf)){
    return `<div class="mt-3 pt-3 border-t border-slate-200 bg-slate-50 -mx-6 px-6 py-3">
      <button onclick="reopenItem(${no})" class="text-sm px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-800 text-white font-medium">\u{1F513} ส่งขออนุมัติใหม่ / Request for Approval</button>
      <div class="text-[11px] text-slate-400 mt-1">ปลดล็อก Owner/Evidence เพื่อแก้ไข แล้วเดินเข้ากระบวนการตรวจทาน-อนุมัติใหม่ทั้งหมด / Unlocks Owner/Evidence for editing and walks the item through Review → Approval again from scratch</div>
    </div>`;
  }
  return '';
}
let HISTORY={}, EXPANDED_HISTORY={};
async function toggleHistory(no){
  if(EXPANDED_HISTORY[no]){ EXPANDED_HISTORY[no]=false; render(); return; }
  if(!HISTORY[no]){
    try{ HISTORY[no]=await fetchJSON('/api/items/'+no+'/history'); }
    catch(err){ alert('โหลดประวัติไม่สำเร็จ / Failed to load history: '+err.message); return; }
  }
  EXPANDED_HISTORY[no]=true; render();
}
function historyPanel(no){
  const h=HISTORY[no]; if(!h) return '';
  const events=(h.events||[]).map(e=>`<div class="text-xs border-l-2 border-slate-200 pl-2 py-1">
      <div class="text-slate-400">${new Date(e.created_at).toLocaleString()} · <b class="text-slate-600">${esc(e.actor_name)}</b></div>
      <div class="text-slate-600">${esc(e.from_state||'—')} → <b>${esc(e.to_state)}</b>${e.comment?': '+esc(e.comment):''}</div>
    </div>`).join('') || '<div class="text-xs text-slate-300 italic">— ยังไม่มีความเคลื่อนไหว / no events yet —</div>';

async function submitItem(no){
  try{ await fetchJSON('/api/items/'+no+'/submit', {method:'POST'}); await refreshItems(); }
  catch(err){ alert('ส่งไม่สำเร็จ / Submit failed: '+err.message); }
}
async function reopenItem(no){
  if(!confirm('รายการนี้ผ่านการอนุมัติแล้ว ต้องการปลดล็อกเพื่อแก้ไขและเข้ากระบวนการตรวจทาน-อนุมัติใหม่ใช่หรือไม่? / This item was already decided — reopen it for editing and send it through Review → Approval again?')) return;
  try{ await fetchJSON('/api/items/'+no+'/reopen', {method:'POST'}); await refreshItems(); }
  catch(err){ alert('เปิดแก้ไขไม่สำเร็จ / Reopen failed: '+err.message); }
}
async function reviewItem(no,decision){
  const comment=(document.getElementById('rc-'+no)||{}).value||'';
  if(decision==='reject' && !comment.trim()){ alert('กรุณาระบุความเห็นก่อนตีกลับ / A comment is required to reject'); return; }
  try{ await fetchJSON('/api/items/'+no+'/review', {method:'POST', body:{decision,comment}}); await refreshItems(); }
  catch(err){ alert('บันทึกไม่สำเร็จ / Failed: '+err.message); }
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
    reader.onerror=()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ / Could not read file'));
    reader.readAsDataURL(file);
  });
}
async function uploadEvidenceFile(no,file){
  const data_base64=await fileToBase64(file);
  return fetchJSON('/api/items/'+no+'/evidence', {method:'POST', body:{file_name:file.name, content_type:file.type, data_base64}});
}
async function approveItem(no,decision){
  const comment=(document.getElementById('ac-'+no)||{}).value||'';
  if(decision==='reject' && !comment.trim()){ alert('กรุณาระบุความเห็นก่อนตีกลับ / A comment is required to reject'); return; }
  const fileInput=document.getElementById('af-'+no);
  const files=fileInput && fileInput.files ? Array.from(fileInput.files) : [];
  if(decision==='complied_with_condition' && !comment.trim() && files.length===0){
    alert('Complied with Condition ต้องมีไฟล์แนบหรือ comment อย่างน้อย 1 อย่าง / requires at least an attached file or a comment');
    return;
  }
  try{
    const fileIds=[];
    for(const f of files){ const uploaded=await uploadEvidenceFile(no,f); fileIds.push(uploaded.file.id); }
    await fetchJSON('/api/items/'+no+'/approve', {method:'POST', body:{decision,comment,evidence_file_ids:fileIds}});
    await refreshItems();
  }catch(err){ alert('บันทึกไม่สำเร็จ / Failed: '+err.message); }
}
async function openEvidence(id){
  try{ const r=await fetchJSON('/api/evidence/'+id); window.open(r.url,'_blank'); }
  catch(err){ alert('เปิดไฟล์ไม่สำเร็จ / Failed to open file: '+err.message); }
}
async function refreshItems(){
  // Full refetch (not just the one item) keeps STATE, the Overview/radar/
  // grade numbers, and the "waiting on you" nav badge all consistent after
  // a workflow transition.
  try{
    const res=await fetchJSON('/api/items');
    ITEMS=res.items;
    STATE={};
    ITEMS.forEach(it=>{ STATE[it.no]={status:it.status, owner:it.owner, note:it.note, clickupUrl:it.clickupUrl, workflowState:it.workflowState}; });
    HISTORY={};
  }finally{ render(); }
}

        <button class="text-sm px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white">+ Add user</button>
      </form>
      <div class="overflow-x-auto"><table class="w-full text-left">
        <thead><tr class="bg-slate-50 text-xs text-slate-500"><th class="px-3 py-2">Name</th><th class="px-3 py-2">Role</th><th class="px-3 py-2 text-center">Status</th><th class="px-3 py-2">Actions</th></tr></thead>
        <tbody>${userRows||'<tr><td colspan="4" class="px-3 py-6 text-center text-slate-400 text-sm">No users yet</td></tr>'}</tbody>
      </table></div>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <h2 class="text-lg font-bold text-blue-800 mb-3">บันทึกการเปลี่ยนแปลง <span class="en text-base">/ Audit Log</span> <span class="text-xs text-slate-400 font-normal">(last 50)</span></h2>
      <div class="overflow-x-auto"><table class="w-full text-left">
        <thead><tr class="bg-slate-50 text-xs text-slate-500"><th class="px-3 py-2">Time</th><th class="px-3 py-2">User</th><th class="px-3 py-2">Item</th><th class="px-3 py-2">Field</th><th class="px-3 py-2">Old</th><th class="px-3 py-2">New</th></tr></thead>
        <tbody>${auditRows||'<tr><td colspan="6" class="px-3 py-6 text-center text-slate-400 text-sm">No changes yet</td></tr>'}</tbody>
      </table></div>
    </div>
  </section>`;
}
async function adminCreateUser(e){
  e.preventDefault();
  const f=e.target, body={ display_name:f.display_name.value, pin:f.pin.value, role:f.role.value };
  try{ await fetchJSON('/api/admin/users',{method:'POST',body}); f.reset(); await loadAdminData(); }
  catch(err){ alert(err.message); }
}
async function adminUpdateUser(id,patch){
  try{ await fetchJSON('/api/admin/users/'+id,{method:'PATCH',body:patch}); await loadAdminData(); }
  catch(err){ alert(err.message); }
}
async function adminResetPin(id){
  const pin=prompt('New PIN (4-8 digits):'); if(!pin) return;
  try{ await fetchJSON('/api/admin/users/'+id,{method:'PATCH',body:{pin}}); alert('PIN updated.'); }
  catch(err){ alert(err.message); }
}
async function adminDeleteUser(id,name){
  if(!confirm('Delete user "'+name+'"? This cannot be undone.')) return;
  try{ await fetchJSON('/api/admin/users/'+id,{method:'DELETE'}); await loadAdminData(); }
  catch(err){ alert(err.message); }
}

// ---------- interactions ----------
function toggleRow(n){ EXPANDED[n]=!EXPANDED[n]; render(); }
// STATE keys are camelCase; the PATCH API expects the raw DB column name
// for the one field where those differ (clickupUrl -> clickup_url).
const FIELD_API_KEY = { clickupUrl: 'clickup_url' };
async function setField(n,k,v){
  const prev = STATE[n] ? {...STATE[n]} : {status:"Not Started",owner:"",note:"",clickupUrl:"",workflowState:"Not Started"};
  STATE[n]=STATE[n]||{}; STATE[n][k]=v;
  // Mirrors the BFF's auto-bump so the badge doesn't lag until the next refetch.
  if(k!=='status' && STATE[n].status==='Not Started') STATE[n].status='In Progress';
  render();
  try{
    await fetchJSON('/api/items/'+n, { method:'PATCH', body:{ [FIELD_API_KEY[k]||k]: v } });
  }catch(err){
    STATE[n]=prev; render();
    alert('บันทึกไม่สำเร็จ / Failed to save: '+err.message);
  }
}
function clearFilters(){ FILTERS={cat:"",risk:"",pri:"",status:"",type:"",q:""}; render(); }
function bind(){
  ['fcat','frisk','fpri','ftype','fstatus'].forEach(id=>{ const e=document.getElementById(id); if(e) e.onchange=()=>{ FILTERS[id.slice(1)]=e.value; render(); }; });
  const fq=document.getElementById('fq');
  if(fq) fq.oninput=()=>{ FILTERS.q=fq.value; render(); const n=document.getElementById('fq'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} };
}

// ---------- BFF client ----------
async function fetchJSON(url, opts){
  opts = opts || {};
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: opts.body ? {'Content-Type':'application/json'} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: 'same-origin'
  });
  if(res.status === 401){ window.location.href = 'login.html'; throw new Error('Not authenticated'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('Request failed ('+res.status+')'));
  return data;
}
async function logout(){
  try{ await fetchJSON('/api/auth/logout', {method:'POST'}); }catch(e){}
  window.location.href = 'login.html';
}

async function init(){
  const app=document.getElementById('app');
  app.innerHTML = '<div class="min-h-screen flex items-center justify-center text-slate-400 text-sm">กำลังโหลด... / Loading...</div>';
  try{
    ME = await fetchJSON('/api/me');
  }catch(e){
    return; // fetchJSON already redirected to login.html on 401
  }
  const [itemsRes, driveRes, appxRes] = await Promise.all([
    fetchJSON('/api/items'),
    fetchJSON('/api/drive'),
    fetchJSON('/api/appendices')
  ]);
  ITEMS = itemsRes.items;
  DRIVE = driveRes.folders;
  APPX = appxRes.appendices;
  STATE = {};
  ITEMS.forEach(it=>{ STATE[it.no] = { status: it.status, owner: it.owner, note: it.note, clickupUrl: it.clickupUrl, workflowState: it.workflowState }; });
  rebuildCats();
  render();
}
init();
</script>
