<script>
const ITEMS = [{"no": 1, "category": "1.Information security governance and personnel/physical security", "name": "Establishment and revision of IT security rules", "content": "Do rules concerning IT security comply with Marubeni Group IT Governance Rules (ITGR)?", "standard": "① Must satisfy all of the requirements in “Appendix 1_Rule Requirements,” which is included in the required rules listed in the sample IT security rules", "evidence": "① Rules for IT security", "article": "6(1)", "issue": "", "risk": "Very High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 2, "category": "1.Information security governance and personnel/physical security", "name": "Establishment and revision of information asset management rules", "content": "Do rules concerning information asset management comply with Marubeni Group IT Governance Rules (ITGR)?", "standard": "①Must satisfy all of the requirements in “Appendix 1_Rule Requirements,” which is included in the required rules listed in the sample　information asset management", "evidence": "① Rules for information asset management", "article": "6(1)", "issue": "", "risk": "Very High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 3, "category": "1.Information security governance and personnel/physical security", "name": "Definition and appointment of IT Managers", "content": "Are the following defined/appointed persons in accordance with the rules or other documents regarding IT Managers(*)?\n\n1. Roles\n2. Individuals (position or full name)\n\n*Individuals responsible for managing company systems and IT devices, ensuring they can be used efficiently, reliably, and maintaining IT security", "standard": "① Items 1 and 2 (“role” and “individuals”) to the left must be described in a document (rules, etc.) that has gone through an approval process", "evidence": "① Documents describing roles individuals", "article": "5(1)", "issue": "", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 4, "category": "1.Information security governance and personnel/physical security", "name": "Definition and appointment of Information Managers", "content": "Are the following defined/appointed persons in accordance with rules or other documents, regarding Information Managers(*)?\n\n1. Roles\n2. Individuals (position or full name)\n\n*Individuals with responsibility and authority for the management of information assets controlled by each department", "standard": "① Items 1 and 2 (“role” and “individuals”) to the left must be described in a document (rules, etc.) that has gone through an approval process", "evidence": "① Documents describing roles individuals", "article": "5(3)", "issue": "", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 5, "category": "1.Information security governance and personnel/physical security", "name": "Cloud service selection criteria", "content": "When introducing cloud services, are the security requirements specified by ITGR comprehensively checked, and are decisions on whether or not to introduce cloud services and alternative measures considered, taking into account the importance and confidentiality of the relevant systems?", "standard": "① Preserve the results of confirming compliance with security requirements at the time of introducing cloud services (e.g., using the cloud risk check sheet).\n② Evaluate risks and implement necessary countermeasures for requirements that have not been complied with.", "evidence": "①② Results of security requirements, consideration of alternative measures, etc.\n①② If you have established your own cloud service selection criteria, the document", "article": "7(1)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 6, "category": "1.Information security governance and personnel/physical security", "name": "Selection of service providers and outsourcing of confidential information management", "content": "When outsourcing the management of critical systems that contain confidential information, do you select an entity that meets one of the following requirements?\n\n1. ISO27001 certification, and ISO27018(*) certification if personal information is retained.\n2. Able to present to clients a SOC2 (type2) audit report showing the results of third-party audits in terms of availability, confidentiality, security, privacy, and integrity\n3. 24/365 monitoring, timely application of vulnerability patches, and multiple vulnerability inspections per year\n4. Confirmation that the person in charge of information management is able to comply with the confidential information management policy stipulated by ITGR, and regular monitoring of the management status.\n\n*Equivalent certification standards (ISO27701, etc.) are acceptable.", "standard": "1) One of the requirements in 1, 2, 3, or 4 on the left must be satisfied.", "evidence": "① ISO certification, etc.\n① SOC2 reports\n② Verification record", "article": "9(1)\n9(2)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 7, "category": "1.Information security governance and personnel/physical security", "name": "Security training for employees", "content": "Are the following conditions satisfied for employee security training?\n\n1. Conducted upon hiring and then at least once per year\n2. Records kept of training attendance history\n3. Conducted in a way that ensures that all employees receive training (in a group or by e-learning) and in a way that cannot be skipped, such as simply sending an email\n4. Contains a comprehensive list of items that all employees should be aware of on a daily basis", "standard": "① Must conduct new hire training, and training must be conducted at least once per year, for all employees\n② Must save a training attendance history for the above\n③ Must make use of methods equivalent to group training and e-learning\n④ Must include content equivalent to training material templates provided by Marubeni\n⑤ Must review training content at least once a year", "evidence": "①②③ Training history over last year (document listing participants, dates, trainee names, and training procedures)\n④⑤ Training content (materials, videos, etc.)", "article": "10(2)", "issue": "①", "risk": "Very High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 8, "category": "1.Information security governance and personnel/physical security", "name": "Provision and dissemination of IT environments to employees", "content": "Are all of the following measures taken after employees are provided with or informed of IT environments (IT devices, software services, network environments, etc.) used for business?\n\n1.Inform employees that, in principle, personal use of the environment and business use other than personal use of the environment (including desktop use of personal PCs and posting of business information on external SNS and websites) are prohibited.\n2. Checking alerts and reports on security measures issued by Marubeni and informing employees of them as necessary", "standard": "① Must train employees or inform them individually about items 1 and 2 to the left", "evidence": "①Training materials or individual memos", "article": "5(4)\n6(1)\n10(3)\n22(1)", "issue": "", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 9, "category": "1.Information security governance and personnel/physical security", "name": "Contracts with internal permanently assigned workers", "content": "If non-employees (subcontractor employees) are permanently assigned in the company, is all of the following information included in outsourcing contracts, etc.?\n\n1. Confidentiality clause\n2. Locus of responsibility in the event of an accident\n3. Compliance with laws and rules", "standard": "① Items 1, 2 and 3 to the left must be contained in the written contracts for outsourcing, etc.", "evidence": "① Contracts for outsourcing, etc.", "article": "2(1)\n3(1)", "issue": "", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 10, "category": "1.Information security governance and personnel/physical security", "name": "Checking and correcting the status of security measures at subsidiaries", "content": "Are the following two actions taken regularly using the ITGR checklist for the maintenance and implementation of information security measures?\n\n1. Self-inspection by subsidiary\n2. Confirmation of the status of security measures at subsidiaries and guidance on corrective actions", "standard": "① Must periodically (approximately once a year) have subsidiaries conduct self-inspections using the ITGR Checklist, etc., provide corrective guidance, and store the results\n※Implementation in companies subject to information security assessment is optional.", "evidence": "① Results of self-checks and confirmation/corrective guidance", "article": "7(1)\n8(1)", "issue": "", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 11, "category": "1.Information security governance and personnel/physical security", "name": "Entry/exit management for business facilities and offices", "content": "Are all of the following implemented with regard to entry/exit management for business facilities and offices?\n\n1. Entry/exit restrictions and locking (authentication by IC card, etc.)\n2. Records kept for entry/exit, locking, etc. (date and time, ID on employee identification card, etc.)", "standard": "① Must implement items 1 and 2 to the left in business locations and offices where confidential information is handled", "evidence": "① Photos of IC card authentication devices, locks, etc.\n① Logs", "article": "12(1)", "issue": "", "risk": "Middle", "priority": "", "qtype": "ー", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 12, "category": "1.Information security governance and personnel/physical security", "name": "Entry/exit management for server rooms, etc.", "content": "Are all of the following implemented for locations where server/network devices are installed (internal server rooms, data centers, etc.)?\n\n1. Entry/exit restrictions (authentication by ID card, etc.) and locking\n2. Entry/exit records (take entry/exit logs, etc.)", "standard": "① Must implement entry/exit restrictions and locking at all installation locations\n② Must keep entry/exit records", "evidence": "① Photos of ID card authentication devices, locks, etc., or reports issued by data centers, etc.\n① Logs", "article": "11(2)", "issue": "①", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 1, "catShort": "Security Governance", "catShortTh": "การกำกับดูแลความปลอดภัยสารสนเทศ"}, {"no": 13, "category": "2.Account management", "name": "Access permission control for important systems", "content": "Is there a system for controlling access permissions based on affiliation, job title, work, etc. (browse, update, delete, etc. digital information) for critical systems(*)?\n\n*Systems (file storage, email servers, authentication servers, systems that hold strictly confidential information, systems subject to IT general control, important infrastructure systems, etc.) where compromised confidentiality, integrity, or availability could result in serious consequences for the operations of the organization", "standard": "① Must implement access permission control systems for all important systems", "evidence": "① Screenshots of access permission configuration screens, etc.", "article": "13(1)\n13(2)", "issue": "①②", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 14, "category": "2.Account management", "name": "Access permission control for other systems", "content": "Is there a system for browsing, updating, and deleting digital information according to access permissions for systems other than important systems?", "standard": "① Must implement access permission control systems for all systems other than important systems", "evidence": "① Screenshots of access permission configuration screens, etc.", "article": "13(1)\n13(2)", "issue": "①②", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 15, "category": "2.Account management", "name": "Account and access permission approval for important systems", "content": "Are all of the following procedures implemented for issuing, changing, and deleting accounts and access privileges for critical systems?\n\n1. General accounts are authorized by the Information Manager, and administrator accounts are authorized by the IT Manager.\n2. A record of the above authorizations are retained for at least a year.\n3. All of the following requirements for the scope and separation of authority are met.\n    1) The scope of access permissions is limited according to affiliation and position.\n    2) The requester and approver of account access permissions are separate.\n    3) IDs are separate for the payment requester and verifier and for the developer and operator.\n4. Once used, an ID must not be reused for a specified period.", "standard": "① Must establish procedures that satisfy items 1, 2, 3, and 4 to the left for all important systems\n② Operations must be in accordance with the procedures mentioned above", "evidence": "① Documents describing procedures\n② Application/approval records (within most recent year)", "article": "13(2)\n13(3)", "issue": "③⑤", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 16, "category": "2.Account management", "name": "Account and access permission approval for other systems", "content": "Are all of the following implemented　for issuing, changing, and deleting accounts and access privileges for systems other than critical systems ?\n\n1. General accounts are approved by the Information Management Manager and administrator accounts are approved by the IT Manager.\n2. Keep the above approval history for at least one year.\n3. All of the following authority ranges and separations are satisfied\n   1) Limit the scope of access privileges according to affiliation and position.\n   2) Separate applicants and approvers for account access privileges\n   3) Separate IDs for payment requesters and verifiers, developers and operators.\n4. IDs that have been used once should not be reused for a certain period of time.", "standard": "① Must establish procedures that satisfy the conditions to the left 1,2,3 for all systems other than important systems\n② Operations must be in accordance with the procedures mentioned above", "evidence": "① Documents describing procedures\n② Application/approval records", "article": "13(2)\n13(3)", "issue": "③⑤", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 17, "category": "2.Account management", "name": "Account and access permission review for important systems", "content": "Are accounts and access permissions for important systems reviewed at least once a year and the results (date and time of implementation, implementer, confirmation results, etc.) approved by an Information Manager for general accounts and an IT Manager for administrator accounts?", "standard": "① Must keep records approved by the individual indicated to the above for the results of reviewing accounts and access permissions for all important systems", "evidence": "① Documents describing procedures\n① Inventory records (within most recent year)", "article": "13(2)\n13(3)", "issue": "④", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 18, "category": "2.Account management", "name": "Account and access permission review for other systems", "content": "Is an inventory of accounts and access privileges for systems other than critical systems conducted at least once a year, and are the results (date, time, person who conducted the inventory, results of verification, etc.) approved by the information management supervisor for general accounts and by the IT manager for administrator accounts?", "standard": "① Must keep records approved by the individual indicated to the left for the results of reviewing accounts and access permissions for all systems other than important systems", "evidence": "① Documents describing procedures\n② Review records (within most recent year)", "article": "13(2)\n13(3)", "issue": "④", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 19, "category": "2.Account management", "name": "Account sharing restrictions", "content": "Is account sharing generally prohibited? If accounts must be shared, are the following implemented?\n\n1. All shared accounts are known\n2. There are valid reasons for sharing, and it is clear why and by whom these accounts are used\n3. The use of environments is limited to listed users, or logs are checked after usage\n4. If accounts are shared temporarily (for outsourced maintenance, etc.), accounts are shared only with required users and passwords are changed whenever the account is no longer shared", "standard": "① There must be no shared accounts, or items 1, 2, 3, and 4 to the left must be performed for all general and administrator accounts\n② Must periodically review the suitability of shared accounts (whether to use shared accounts or not, and who will use them)", "evidence": "① Records of account sharing reasons, uses, users, and environments\n① Records of temporary account lending\n② Results of reviewing suitability", "article": "13(2)", "issue": "③④", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 20, "category": "2.Account management", "name": "Disabling or deleting unnecessary accounts", "content": "Are all of the following measures taken in relation to disabling or deleting accounts that are unnecessary for business operations?\n \n1. Making an account unavailable by the last day of service in the case of an employee or the day the contract expires in the case of a subcontractor, etc.\n2. Disabling or deleting an inactive account after a certain period of inactivity", "standard": "① Must delete the accounts of all employees who leave the company and persons whose service contract is expiring, using one of the following methods\n• Automatically delete or disable on the day the employee leaves or the day the contract expires\n• Manually delete immediately after the retirement date or the contract expiration date (If it is difficult to delete on the same day, it is necessary to disable access by the account and invalidate or delete at an appropriate time such as monthly review)\n② Must establish and follow procedures that satisfy item 2 to the left", "evidence": "①② List of deleted/disabled accounts (within most recent year)\n① List of employees who have left the company and persons whose service contracts have expired (within most recent year)\n② Document that contains the procedures", "article": "13(2)", "issue": "⑤", "risk": "High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 21, "category": "2.Account management", "name": "Password policy for PCs and servers participating in AD", "content": "Does the password policy for PCs and servers in an AD (Active Directory) environment meet all requirements listed in “Appendix 2_List of Password Requirements”?", "standard": "① Passwords for PCs in an AD environment must satisfy the requirements in \"Appendix 2_List of Password Requirements\"\n② Passwords for servers in an AD environment must satisfy the requirements in \"Appendix 2_List of Password Requirements\"", "evidence": "①② Screenshots of password policy configuration screens for AD", "article": "14(2)\n14(3)", "issue": "①ⅰ～ⅵ\n④⑤", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 22, "category": "2.Account management", "name": "Password policy for individual systems", "content": "Does the password policy for individual systems not participating in AD meet all requirements listed in “Appendix 2_List of Password Requirements”?", "standard": "② All individual systems not participating in AD must satisfy requirements in “Appendix 2_List of Password Requirements”", "evidence": "① Screenshots of password policy configuration screens for individual systems", "article": "14(2)\n14(3)", "issue": "①ⅰ～ⅵ\n④⑤", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 23, "category": "2.Account management", "name": "Password Management", "content": "Are all of the following measures taken in order to prevent a password from being known to anyone other than its user?\n\n1. Require initial password change at first login\n　　1) Provide a function to force a password change for the first time use.\n　　2) If the above is not possible due to the system specifications, the system will inform the customer to change the password to one that only the customer knows at the time of issuance or at some other point in time.\n2. Informing only the user of their password.\n3. Masking passwords when users type them in (masking password characters with asterisks, etc.)", "standard": "① PCs participating in AD must have their initial passwords changed\n② Servers participating in AD must have their initial passwords changed\n③ Must implement item 1 to the left for all passwords for individual systems (requesting that users change initial passwords)\n④ Must maintain a practice that meets item 2 to the left\n⑤ Must maintain a function that meets item 3 to the left", "evidence": "①②Screenshot of AD account setup screen\n③Screenshot of password change request screen or text of email inviting the change\n④ Email notifications\n⑤ Screenshots of password setting screens", "article": "14(3)", "issue": "", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 2, "catShort": "Account Management", "catShortTh": "การจัดการบัญชีผู้ใช้"}, {"no": 24, "category": "3.IT asset management and measures for IT devices", "name": "Asset management for PCs and OS/software", "content": "Is the following information recorded as asset management for all PCs?\n\n1.Maintain an asset management ledger that covers the following\n 1) Device information: Device type, manufacturer, model, host name, user\n 　*Host name: Computer name, serial number, etc.\n 　*Location: Branch, branch name, building name, etc.\n 2) OS information: Type, version, end of support\n 3) Applications (Java/Adobe products, browsers, Office products, etc.): Type, version, end of support\n\n2. All of the following measures are taken using the record noted above.\n　1) Conducting a physical inventory (at least once a year)\n　2) Monitoring expiration dates of support services for installed software (at least once a year)", "standard": "① Must manage items 1 to the left using a ledger or configuration management system for all PCs\n② Must not use OS/applications that are no longer supported\n③ Must implement any of the following\na) Install a configuration management system and implement automatic updates\nb) If using ledger management, keep applications, etc. updated by conducting a periodic review", "evidence": "①②③ Files or management ledgers output from the configuration management system\n③ Inventory result", "article": "15(2)\n15(3)", "issue": "", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 25, "category": "3.IT asset management and measures for IT devices", "name": "Asset management for smartphones and tablets", "content": "Is the following information recorded as asset management for all smartphones/tablets?\n\n1.Maintain an asset management ledger that covers the following\n 1) Device information: Device type, manufacturer, model, host name\n 2) OS information: Type, version, end of support\n 3) Applications: Type, version, end of support\n\n2.All of the following are implemented using the above ledgers\n　1) Control of actual products (at least once a year)\n　2) Support expiration date management for installed software (at least once a year)", "standard": "① Must manage items 1, 2, and 3 to the left using a ledger or configuration management system for all smartphones and tablets\n② Must not use OS/applications that are no longer supported\n③ Must implement any of the following\na) Install a configuration management system and implement automatic updates\nb) If using ledger management, keep applications, etc. updated by conducting a periodic review", "evidence": "①②③ Files or management ledgers output from the configuration management system\n③ Inventory result", "article": "15(2)\n15(3)", "issue": "", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 26, "category": "3.IT asset management and measures for IT devices", "name": "Asset management for servers", "content": "Is the following information recorded as asset management for all servers?\n\n1.Maintain an asset management ledger that covers the following\n 1) Device information: Device type, manufacturer, model, host name\n 2) OS information: Type, version, end of support\n 3) Middleware/applications: Type, version, end of support\n 4) Hardware: End of maintenance support\n\n2.All of the following are implemented using the above ledgers\n　1) Control of actual products (at least once a year)\n　2) Support expiration date management for installed software (at least once a year)", "standard": "① Must manage items 1 to the left using a ledger or configuration management system, for all servers\n② Must not use OS/middleware/applications/hardware that is no longer supported\n③ Must implement any of the following operations\n1) Install a configuration management system and perform automatic updates\n2) If using ledger management, keep applications, etc. updated by conducting a periodic review", "evidence": "①②③ Files or management ledgers output from the configuration management system\n③ Inventory result", "article": "15(2)\n15(3)", "issue": "", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 27, "category": "3.IT asset management and measures for IT devices", "name": "Asset management for network devices", "content": "Is the following information recorded as asset management for all network devices?\n\n1.Maintain an asset management ledger that covers the following\n 1) Device information: Device type, manufacturer, model, host name, user\n 2) OS/firmware: Type, version\n 3) Hardware: End of maintenance\n\n2.All of the following are implemented using the above ledgers\n　1) Control of actual products (at least once a year)\n　2) Support expiration date management for installed software (at least once a year)", "standard": "① Must manage items 1, 2, and 3 to the left using a ledger or configuration management system, for all network devices\n② Must not use OS/hardware that is no longer supported\n③ Must implement any of the following\na) Install a configuration management system and perform automatic updates\nb) If using ledger management, keep applications, etc. updated by conducting a periodic review", "evidence": "①②③ Files or management ledgers output from the configuration management system\n③ Inventory result", "article": "15(2)\n15(3)", "issue": "", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 28, "category": "3.IT asset management and measures for IT devices", "name": "General user permissions for PCs", "content": "Are controls in place to prevent general users from adminstrative access; preventing unauthorized use of company-owned PCs?", "standard": "① Controls must be in place so that general users are not granted administrator permissions, for all company-owned PCs", "evidence": "① AD Administrators group user list screens (to show whether only certain members are included)\n① Affiliated groups in properties of general users (to show they are not administrators)", "article": "16(2)", "issue": "①ⅲ", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 29, "category": "3.IT asset management and measures for IT devices", "name": "Authentication to PCs", "content": "Are both of the following implemented for PC authentication?\n\n1.All of the following for company-owned PCs\n・ Users are required to authenticate at startup (when the power is turned on)\n・ Users are required to re-authenticate after a period of inactivity\n\n2. When using a personally-owned PC for work, users are required to authenticate in order to access a company network, using a one-time password for two-factor authentication.", "standard": "①Must set up to enforce the authentication of 1 and 2 on the left.", "evidence": "①Screenshot of the Authentication Settings Management Screen", "article": "16(2)", "issue": "①ⅰ、②i", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 30, "category": "3.IT asset management and measures for IT devices", "name": "Concealment of confidential information stored on portable PCs", "content": "Are both of the following implemented for PC ?\n\n1.Either of the following items are implemented for portable PCs (notebook PCs, etc.)\n・ Hard disks encryption\n・ A system to prevent data from being saved to terminals\n\n2. A system to prevent data from being saved to terminals when a personally-owned PC is used for work", "standard": "①Must install a system that meets items1 and 2 to the left", "evidence": "① Proof that the system described to the left has been introduced (screenshots of lists of terminals introduced on HDD encryption tool central management screens, VDI management screens, etc.)", "article": "16(2)", "issue": "①ⅳ、②ⅱ", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 31, "category": "3.IT asset management and measures for IT devices", "name": "Controls for writing from PCs to external storage media", "content": "Is writing from PCs to external storage media generally prohibited? If this is unavoidable, are the following performed?\n\n1.Either of the following measures is taken for company PCs\n・ Controls are in place to prevent writing, and bypassing these controls requires approval\n・ Data is encrypted prior to writing\n\n2. Controls (which cannot be bypassed) are in place to prevent writing data to a personally-owned PC when it is used for work.", "standard": "① Must install a system that meets items 1 and 2 to the left\n② If bypassing controls requires approval in item 1 to the left, must periodically review application/approval results", "evidence": "①② Screenshots of configuration screens in items 1 and 2 to the left\n② Cancellation application and approval records (within the most recent year)\n② Review records", "article": "16(2)", "issue": "①ⅴ、②ⅲ", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 32, "category": "3.IT asset management and measures for IT devices", "name": "Application/approval and dissemination of precautions when an IT device without advanced encryption measures taken is removed from the premises", "content": "When removing an IT device without advanced encryption measures taken (PCs, external storage media, etc.) from the premises, are all of the following measures taken?\n  \n1. Relevant precautions are disseminated, such as minimizing the storage of digital information prevention of theft/loss\n2. Information Manager approval is required", "standard": "① Must disseminate precautions described in item 1 to the left\n② Must keep records of when systems, etc. are approved for removal", "evidence": "① System, etc. removal permission records\n② Memos", "article": "16(1)", "issue": "", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 33, "category": "3.IT asset management and measures for IT devices", "name": "Prohibition of use of personal PC desktop environments", "content": "When working remotely using a personal PC, by one of the following remote access methods, are any of these personal PC desktop environments prohibited?\n\n1. VDI (Virtual Desktop Infrastructure): Screen captures from a virtual desktop environment on a server are transferred\n2. Application virtualization: Individual applications are virtualized and screen captures are transferred\n3. Agent-based services: The user’s PC environment is virtualized and screen captures are transferred", "standard": "① Must inform employees that the use of personal PC desktop environments cannot be used for business purposes", "evidence": "① Memos (rules, training materials, individual memos, etc.)", "article": "21(1)", "issue": "", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 34, "category": "3.IT asset management and measures for IT devices", "name": "Disposal of PCs and servers", "content": "When disposing of company-owned PCs and servers, are systems physically destroyed or handed over to a specialist so that storage devices cannot be reused?", "standard": "① Must keep records on all discarded PCs and servers indicating that reuse is not possible", "evidence": "① Photos showing the physical destruction of storage media, or data erasure certificates", "article": "15(4)", "issue": "", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 35, "category": "3.IT asset management and measures for IT devices", "name": "Authentication, locking, and erasing data for smartphones and tablets", "content": "Are the following implemented through MDM (Mobile Device Management), etc. for smartphones and tablets（“smartphones, etc.” hereafter)?\n\n1.All of the following for company smartphones and other devices\n・ Controls in place to prevent unauthorized changes to settings or modifications of functionality (Jailbreak,rooting,etc.)\n・ Authentication is required upon startup or after a period of inactivity\n・ Business data is deleted or devices can be locked remotely in case of loss or theft\n・ Business data is deleted when devices are disposed of\n\n2. All of the following measures are taken when personally-owned smartphones, etc. are used for work.\n　・PIN authentication is required upon startup or resuming from pause\n　・Business app data is deleted remotely in case of loss or theft\n　・Business app data is deleted when smartphones, etc. are disposed of", "standard": "① Must implement MDM or another similar system (MAM or another similar system in case of personally-owned smartphones, etc.) to control settings changes and function modifications and must configure settings so that items 1 and 2 to the left are satisfied, for all smartphones and tablets", "evidence": "① Screenshots of configuration management screens for authentication, wiping, etc.", "article": "16(2)", "issue": "①ⅲ,ⅵ,ⅶ\n②ⅰ,ⅳ,ⅴ", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 36, "category": "3.IT asset management and measures for IT devices", "name": "Data encryption and storage location control for smartphones and tablets", "content": "Are the following implemented through MAM (Mobile Application Management), etc. for smartphones and tablets whether they are company-owned or personally-owned ?\n\n1. Information stored on terminals is encrypted\n2. Saving to external storage media (SD cards, etc.) is prohibited\n3. Business data can be stored only by company applications", "standard": "① Must implement MAM or another similar system and must configure settings so that items 1, 2, and 3 to the left are satisfied for all smartphones and tablets", "evidence": "① Screenshots of configuration management screens for encryption, data storage locations, etc.\n(For iOS terminals, implement encryption by setting an authentication password)", "article": "16(2)", "issue": "①ⅳ,②ⅱ", "risk": "Middle", "priority": "", "qtype": "① System-related", "catNo": 3, "catShort": "IT Asset Management", "catShortTh": "การจัดการสินทรัพย์ IT"}, {"no": 37, "category": "4.Software and anti-virus/vulnerability protection", "name": "Authentication of software/services used on PCs", "content": "Are the following software/services implemented for PCs?\n\n1. Authorization as a standard software service is given by an IT Manager after confirming there are no issues with systems and service provider information management organizations, and that other security risks are low\n2. Company-authorized standard software/services are managed in list form", "standard": "① Must not include software/services with high security risk such as information leakage from company-authorized software/services\n② Must manage company-authorized software/services in list form", "evidence": "① Security check records for company-authorized software/services\n② List of company-authorized software/services", "article": "17(1)\n17(2)\n17(4)", "issue": "①,②\n①～③", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 38, "category": "4.Software and anti-virus/vulnerability protection", "name": "Authentication of applications used on smartphones and tablets", "content": "Are the following implemented for applications used on smartphones and tablets?\n\n1. Authorization as a standard software service is given by an IT Manager after confirming there are no issues with systems and service provider information management organizations, and that other security risks are low\n2. Company-authorized standard applications are managed in list form", "standard": "① Must not include applications with high security risk such as information leakage from company-authorized applications\n② Must manage company-authorized applications in list form", "evidence": "① Security check records for company-authorized applications\n② List of company-authorized applications", "article": "17(1)\n17(2)\n17(4)", "issue": "①,②\n①～③", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 39, "category": "4.Software and anti-virus/vulnerability protection", "name": "Approval of use of software, etc. other than standard  software", "content": "Does the IT Manager verify that all of the following conditions are met before granting approval when specified users use software other than standard software in exceptional circumstances?\n\n1. Users and operations are restricted to the minimum level required\n2. The following are set according to determined security measures\n　• Confidential information and personal information are not handled\n　• Content is confirmed through a separate written document\n3. Permitted for a maximum of one year and uninstalled immediately at the end of this period.  Continued use requires reapproval.", "standard": "① Must establish procedures that satisfy items 1, 2, and 3 to the left\n② Must keep application/approval records for the above\n③ Must conduct periodic inventories to ensure that applications, etc. are always uninstalled after end of period", "evidence": "① Documents describing procedures\n② Application/approval records (within most recent year)\n③ Inventory records", "article": "17(1)\n17(2)", "issue": "①,②", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 40, "category": "4.Software and anti-virus/vulnerability protection", "name": "Software license management", "content": "Are software licenses properly managed (such as periodic inventories taken to determine whether a sufficient number of licenses are owned)?", "standard": "① Must perform appropriate management such as periodically confirming the number of licenses owned and the number of licenses used", "evidence": "① Software license management documentation (delivery slips, license management ledgers, etc.)", "article": "15(3)", "issue": "②", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 41, "category": "4.Software and anti-virus/vulnerability protection", "name": "Antivirus software update/scan settings for PCs", "content": "Are the following antivirus implementations in place for PCs?\n\n1. Antivirus software is installed\n2. Configured so that scanning and definition files are updated to the latest version\n3. Real-time scanning is performed\n4. Configured so that a full scan is performed regularly (at least once per week)", "standard": "① Centrally managed PCs: Must set items 2, 3, and 4 to the left, monitor terminals that have not been updated, leave nothing omitted\n② Regarding all PCs not mentioned above employees must be informed/instructed that items 2, 3, and 4 to the above must be satisfied, and must conduct a compliance review at least once per month", "evidence": "① Screenshots of configuration management screens\n① List of PC update status\n② Screenshots of configuration screens for PCs\n② Memos\n② Review records", "article": "18(2)", "issue": "①,②", "risk": "Very High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 42, "category": "4.Software and anti-virus/vulnerability protection", "name": "Antivirus software update/scan settings for servers", "content": "Are servers configured with the following antivirus implementations?\n\n1. Antivirus software is installed\n2. Configured so that scanning and definition files are updated to the latest version\n3. Real-time scanning is performed\n4. Configured so that a full scan is performed regularly (at least once per week)", "standard": "① Centrally managed servers: Must set items 2, 3, and 4 to the left, monitor terminals that have not been updated, leave nothing omitted\n② All servers other than those mentioned above: Must inform/instruct server administrators that items 2, 3, and 4 to the left must be satisfied, and a compliance inventory must be conducted at least once per month", "evidence": "① Screenshots of configuration management screens, or summary reports\n① List of server update status\n② Screenshots of configuration screens for servers\n② Memos\n②  Review records", "article": "18(2)", "issue": "①,②", "risk": "Very High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 43, "category": "4.Software and anti-virus/vulnerability protection", "name": "Prevention of disabling systems to prevent and detect unauthorized intrusion into PCs and servers", "content": "The following requirements must be satisfied to prevent systems that prevent/detect unauthorized access to PCs and servers (antivirus software, EDR, etc.) from being disabled.\n\n1. Installed with settings configured to prevent disabling\n2. Installed with settings configured to allow disabling only by users with administrator permissions, and administrator permissions are not granted to general users\n3. Monitoring is performed to detect when systems are disabled", "standard": "①Satisfy any of the following:\n・All PCs and servers must be configured to satisfy item 1 or 2 to the left\n  ・Must constantly monitor the vital status of systems as described in item 3 to the left to prevent and detect unauthorized access", "evidence": "① Screenshots of configuration screens　or monitoring screens", "article": "18(3)", "issue": "①,②", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 44, "category": "4.Software and anti-virus/vulnerability protection", "name": "Application of latest OS and application security patches for PCs", "content": "Are the latest vendor-supplied security patches checked regularly (at least on a monthly basis) and applied to OS/applications on all PCs in a timely manner?", "standard": "① PCs monitored by a configuration management system must apply the latest security patches to OS/applications, and monitor and respond to all unpatched terminals\n② Regarding PCs other than those mentioned above, employees must be informed/instructed to always apply the latest security patches, and must conduct a compliance review at least once per month", "evidence": "① Screenshots of configuration management screens for configuration management system\n① List of PC update status\n② Screenshots of screens showing OS updates and application versions for PCs\n② Memos\n② Review records", "article": "18(4)", "issue": "", "risk": "Very High", "priority": "◎", "qtype": "②-1 Operations-related (significant)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 45, "category": "4.Software and anti-virus/vulnerability protection", "name": "Application of latest OS and application security patches for smartphones and tablets", "content": "Are the latest vendor-supplied security patches checked regularly (at least on a monthly basis) and applied to OS/applications on all smartphones and tablets  in a timely manner?", "standard": "① Terminals monitored by a configuration management system must apply the latest security patches to OS/applications, and monitor and respond to all unpatched terminals\n② Regarding terminals other than those mentioned above, employees must be informed/instructed to always apply the latest security patches, and must conduct a compliance review at least once per month", "evidence": "① Screenshots of configuration management screens for configuration management system\n① List of terminal update status\n② Screenshots of screens showing OS updates and application versions for terminals\n② Memos\n② Review records", "article": "18(4)", "issue": "", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 46, "category": "4.Software and anti-virus/vulnerability protection", "name": "OS, middleware, and application security patching status for servers", "content": "Are the latest vendor-supplied security patches checked regularly (at least on a monthly basis) and applied to OS/middleware/applications on servers in a timely manner?", "standard": "① Servers monitored by a configuration management system must apply the latest security patches to OS/middlware/applications, and monitor and respond to all unpatched terminals\n② Regarding servers other than those mentioned above must implement operational procedures to always apply the latest security patches, and must conduct a compliance review at least once per month", "evidence": "① Screenshots of configuration management screens for configuration management system\n① List of server update status\n② Screenshots of screens showing OS updates and middleware/application versions for servers\n② Operational procedures\n② Review records", "article": "18(4)", "issue": "", "risk": "Very High", "priority": "◎", "qtype": "②-1 Operations-related (significant)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 47, "category": "4.Software and anti-virus/vulnerability protection", "name": "Application of latest OS and hardware security patches for network devices", "content": "Are the latest vendor-supplied security patches checked regularly (at least on a monthly basis) and applied to  OS/hardware on network devices in a timely manner?", "standard": "① Must always apply the latest security patches to the OS/hardware of all network devices, and must conduct a compliance review at least once per month", "evidence": "① Screenshots of screens showing firmware/OS versions for network devices installed on Internet boundaries", "article": "18(4)", "issue": "", "risk": "Very High", "priority": "◎", "qtype": "②-1 Operations-related (significant)", "catNo": 4, "catShort": "Software & Anti-virus", "catShortTh": "ซอฟต์แวร์และการป้องกันไวรัส"}, {"no": 48, "category": "5.Network control", "name": "Preparation of network diagrams", "content": "Are logical network diagrams for the subnets and components of the company network comprehensive and always kept up-to-date?", "standard": "① Must keep a record of the company network diagram: all LANs, connection points, and devices listed in the network device management ledger\n② Must keep the company network diagram up-to-date and conduct periodic reviews", "evidence": "① Network diagrams\n② Change logs", "article": "19(2)", "issue": "①", "risk": "Very High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 49, "category": "5.Network control", "name": "Configuration management of connection points with external networks", "content": "Are configurations for all of the following managed with regard to connection points with external networks (networks belonging to other companies, M-IGS network, the Internet, etc.) connecting to the company's internal network?\n\n1. Controlling company\n2. Communication control\n3. Routing", "standard": "① Any of the following must be implemented to manage configurations for items 1, 2, and 3 to the left for all connection points with external networks\n1) Perform automatic updates using a network configuration management system with functionality to visualize the logical configuration\n2) If performing a manual configuration, must keep systems, etc. up-to-date each time the configuration is changed, and must conduct periodic reviews", "evidence": "① Files output from the network configuration management system, or configuration management documents and change logs\n① List of IP addresses and MAC addresses of LAN devices connected to external networks", "article": "19(2)", "issue": "②", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 50, "category": "5.Network control", "name": "Settings for Wi-Fi connections", "content": "Are authentication and encryption methods that meet the following used for connections to Wi-Fi?\n\n1. Authentication: Highly secure methods of mutual authentication (PEAP, TLS, TTLS, EAP-FAST) (*)\n2. Encryption: WPA2 or higher\n\n*In the following cases, a method without mutual authentication is also acceptable\n　・ Connection to a network other than the one normally used by employees\n　　(If using PSK authentication or other methods that use a common password, the password must be periodically changed at least once per month)\n　・ When the connection destination is limited to a VDI server, etc.", "standard": "① Must use authentication and encryption methods that meet items 1 and 2 to the left", "evidence": "① Screenshots of screens showing authentication and encryption methods", "article": "19(3)", "issue": "①,②", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 51, "category": "5.Network control", "name": "Isolation of areas other than networks normally used by employees", "content": "Are the following implemented for networks other than those normally used by employees (guest Wi-Fi, network for video calls, and special networks*)?\n\n1. Physically or logically separated from the company network\n2. Logs of network devices (firewalls, web proxies, remote access systems, DNS servers) must be kept for at least one year.\n3. For special networks, all security measures specified by ITGR (ITGR Checklist Nos. 22, 24, 28, 41, 44, 58, 61, 76) are applied to PCs\n\n※Special networks: Networks that are exclusively laid out for specific business use (e.g., dedicated networks for using market information services, etc.)", "standard": "① Must implement items 1, 2 and 3 to the left", "evidence": "① Network diagrams\n① Screenshots of configuration screens for switches (if separated logically)\n① Network device logs", "article": "19(4)", "issue": "", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 52, "category": "5.Network control", "name": "Controlling access to cloud services with privileged IDs", "content": "Are all of the following implemented for access by privileged IDs for cloud service management (AWS, MS Azure management console, etc.) ?\n  \n1.Must manage access permissions to prevent authentication from general accounts\n2..Either of the following items are implemented\n 1)IP address control to limit access through the company's own network\n 2)Must perform electronic certificate authentication", "standard": "①Set access privileges to satisfy 1 on the left.\n②Set up management functions to satisfy 2 on the left.", "evidence": "①Screenshot of the access permission setting screen\n②Screenshot of the management function setting screen", "article": "19(5)", "issue": "①,②", "risk": "Very High", "priority": "◎", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 53, "category": "5.Network control", "name": "Access control for maintenance/operation environments", "content": "For access to the Maintenance/operation environment (*) (excluding access to privileged IDs for cloud service management), are all of the following requirements implemented?\n\n1. Must manage access permissions to prevent authentication from general accounts\n2. Must separate segments for important systems from networks that are accessible from general accounts (for cloud services*, control IP addresses to limit access to those via the company's own network)\n\n*Maintenance/operation environment includes all of the following requirements\n1) Administrator functions of production environment (including WordPress admin screen, MongoDB user authentication, etc.)\n2. Development and test environment, etc.", "standard": "① Must configure access permissions to satisfy item 1 to the left\n② Must separate segments by configuring network devices with boundaries, etc. to satisfy item 2 to the left", "evidence": "① Screenshots of access permission configuration screens\n② Screenshots of configuration screens for boundary network devices", "article": "19(5)", "issue": "①,②", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 54, "category": "5.Network control", "name": "Remote access during maintenance and operation", "content": "Are all of the following measures taken for remote maintenance and operation (including access to cloud service management functions)?\n\n1. Limiting access from the work environment to the minimum necessary\n2. Requiring approval of the IT Manager and maintaining approval records\n3. Maintaining work records\n4. Checking work records against work permission requests", "standard": "①Establish procedures that satisfy 1, 2, 3, and 4 on the left.\n②Maintain work permission records and work records of 2 and 3 on the left.\n③Must periodically review the cross-checking results noted in 4 to the left and approval validity", "evidence": "①Procedural documents\n②Application and approval records\n③Inventory records", "article": "19(5)", "issue": "③", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 55, "category": "5.Network control", "name": "Control of internal/external communications", "content": "Are the following implemented using firewalls, routers, etc., with regard to internal/external communication controls?\n\n1. Firewalls are set to deny all, with only IP addresses and ports required for business allowed by whitelist\n2. The following ports are generally blocked for communications from outside the company to inside the company; if they are open, the business reason for doing so is indicated and access is permitted for only certain sources:\n21(ftp),22(ssh),23(telnet),135(rpc),137/138/139(netbios),161(snmp),389(ldap),445(smb),512(rexcec),513(rlogin),514(rshell),3389/5800/5900(rdp,vnc)\n3. All ports above 1024 other than 3389/5800/5900 (rdp) are blocked for communications from inside the company to outside the company; if they are open, the business reason for doing so is indicated and access is permitted for only certain sources", "standard": "① Must have controls in place to ensure that items 1, 2, and 3 to the left are all satisfied and must clarify the reason for opening ports, etc., for internal/external communication\n② Must periodically review communication control settings", "evidence": "① Screenshots of screens showing firewall communication control settings, or results of executing commands showing settings\n① List of IP addresses, ports, and protocols allowed for internal/external communications, and reasons for allowing them\n② Firewall change management logs", "article": "20(2)", "issue": "①", "risk": "Very High", "priority": "◎", "qtype": "②-1 Operations-related (significant)", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 56, "category": "5.Network control", "name": "Monitoring and detection of internal/external communications", "content": "Are the following implemented for internal/external communication?\n\n1. Communication monitoring is performed by detecting behavior, etc.\n2. Detection for high volume traffic from the internal network to an external network", "standard": "① Must implement the system described in item 1 to the left\n② Must conduct continuous monitoring of item 2 to the left", "evidence": "① Screenshots of activity monitoring screens\n② Screenshots of traffic monitoring screens\n② Detection confirmation records", "article": "20(2)", "issue": "③,④", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 57, "category": "5.Network control", "name": "Port/service restrictions for servers", "content": "Are both of the following implemented for ports/services for servers?\n\n1. SMB (Server Message Block [port 445]) and RDP (Remote Desktop Protocol [port 3389]) are disabled\n2. Only ports/services used for business are whitelisted", "standard": "① Must disable SMB and RDP, or minimize the number of IP addresses that can connect after clarifying why this is required for business\n② All servers should be closed except for the ports/services used for business operations.", "evidence": "①② Screenshots of configuration screens defining required ports/services", "article": "20(3)", "issue": "", "risk": "Very High", "priority": "◎", "qtype": "②-1 Operations-related (significant)", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 58, "category": "5.Network control", "name": "Port/service restrictions for PCs", "content": "Are all of the following ports/services implemented for PCs?\n\n1. SMB (Server Message Block [port 445]) and management share (default share) functionality are disabled\n2. Only ports/services used for business purposes are allowed", "standard": "① Must disable SMB and management shares, or set appropriate restrictions after clarifying why this is required for business purposes\n② All PCs should be closed except for the ports/services used for business operations.", "evidence": "①② Screenshots of configuration screens defining required ports/services", "article": "20(3)", "issue": "", "risk": "Very High", "priority": "〇", "qtype": "②-1 Operations-related (significant)", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 59, "category": "5.Network control", "name": "Two-factor authentication for publicly available important systems", "content": "Is two-factor authentication implemented for important systems（including cloud services） with servers outside the company network (accessible directly from the Internet)?", "standard": "① Must provide two-factor authentication for all relevant systems", "evidence": "① Screenshots of authentication settings or actual login screens", "article": "20(4)", "issue": "", "risk": "Very High", "priority": "◎", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 60, "category": "5.Network control", "name": "Remote access method measures (VPN)", "content": "If a VPN (Virtual Private Network) is used, are the following implemented with regard to remote access?\n\n1. Two-factor authentication including terminal authentication\n2. Controls are in place to use digital certificates, etc., to prevent access from terminals other than company-owned PCs\n3. It is controlled so that it cannot be accessed from terminals with high security risk (like a security patch not applied, etc.)\n4. Limit the segments/servers that can be accessed by each user", "standard": "① Must satisfy items 1, 2, 3, and 4 to the left by configuring VPNs, etc.", "evidence": "① Screenshots of management screens, etc. for VPNs", "article": "21(2)", "issue": "①", "risk": "Very High", "priority": "◎", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 61, "category": "5.Network control", "name": "Remote access method measures (VDI, etc.)", "content": "If VDI (Virtual Desktop Infrastructure), application virtualization, or agent-based services are used, are the following implemented with regard to remote access (including access from personal PCs)?\n\n1. Two-factor authentication\n2. Clipboard sharing and file sending/receiving functions are disabled between the connecting PC and the connection environment to prevent data from being downloaded by the connected PC\n3. For agent-based services(*): Agent software on the connecting PC is forcibly updated to the latest version when connecting, or only certain versions are allowed to connect\n\n*Virtualize the environment of the user's PC and transfer the screen (TeamViewer, RemoteView, etc.)", "standard": "① Must satisfy items 1, 2, and 3 to the left by configuring VDIs, etc.", "evidence": "① Screenshots of management screens, etc. for VDIs", "article": "21(2)", "issue": "②", "risk": "Very High", "priority": "◎", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 62, "category": "5.Network control", "name": "Precautions for using non-corporate environments", "content": "Are employees who are using remote access informed of the following?\n\n1. The use of public Wi-Fi should be kept to a minimum; if Wi-Fi has to be used, it should be authenticated and encrypted by a trusted provider\n2. Antivirus/security patches must be applied when using a PC not owned by the company", "standard": "① Must inform employees of items 1 and 2 to the left", "evidence": "① Memos (rules, training materials, individual memos, etc.)", "article": "21(2)", "issue": "③ⅲ", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 63, "category": "5.Network control", "name": "Ensuring of remote access scalability", "content": "Is scalability ensured in a way that assuming constant access by all employees, with regard to remote access and networks?", "standard": "① Must confirm that this is ensured either through response from the vendor or a contract", "evidence": "① Vendor responses or contracts", "article": "21(2)", "issue": "③ⅳ", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 64, "category": "5.Network control", "name": "Web filtering control", "content": "Are web filtering tools installed and appropriately configured to control access to websites that are not business relatemd or carry a high risk?", "standard": "① Must install web filtering tools\n② Must block all of the following categories, or clarify why they are required for business purposes\na) Sites that can be used to publish information: free chat tools, free email services, chat sites, blogs, bulletin boards\nb) Sites from which software can be downloaded\nc) Websites unrelated to business: gaming, dating, adult sites, online TV, streaming/video\nd) Malicious websites: proxy avoidance systems, spyware, hacking, phishing, joke programs\ne) Information exchange services/tools: online storage, file download services\n③ Must periodically review the validity of blocked sites", "evidence": "①② Screenshots of screens showing that access is controlled via web filtering\n③ Review records", "article": "22(1)", "issue": "", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 65, "category": "5.Network control", "name": "Approval when canceling web filtering", "content": "Are all of the following measures taken when disabling web filtering for specified users?\n \n1. Supervisors of users requiring access grant approval to individual users for each specified website\n2. The maximum period of access permitted is one year, and continued access requires reapproval", "standard": "① Must establish procedures that satisfy item 1 and 2 to the left\n② Must keep application/approval records for item 1 and 2 to the left\n③ Must provide functionality to automatically disable setting after end of period, or must periodically inventory whether to disable setting if this is done manually", "evidence": "① Procedural documents\n② Application/approval records\n③ Screenshots of cancellation configuration screens\n③ Cancellation operational procedures and review records", "article": "22(2)", "issue": "①,②", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 5, "catShort": "Network Control", "catShortTh": "การควบคุมเครือข่าย"}, {"no": 66, "category": "6.Security measures for business systems and communication tools", "name": "Measures for business systems", "content": "Before developing a business system, are the security requirements specified in the ITGR thoroughly reviewed, and are alternative measures considered in light of the importance and confidentiality of the system?", "standard": "① Must check compliance with security requirements during business system development, and store the results (checked using System Development Security Check Sheet, etc.)\n② Must assess the risks associated with the requirements that are not complied with and take necessary measures", "evidence": "①② Results of reviewing the security requirements and alternative measures\n①② Document pertaining to the verification criteria if any", "article": "23(2)", "issue": "", "risk": "Middle", "priority": "", "qtype": "ー", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 67, "category": "6.Security measures for business systems and communication tools", "name": "Email antivirus and spam filtering", "content": "Are both of the following implemented for email?\n\n1. Attachments are checked for viruses\n2. Spam email filtering", "standard": "① Email services must have the functionality described in items 1 and 2 to the left", "evidence": "① Screenshots of management screens, or service specifications, etc.", "article": "24(2)", "issue": "①", "risk": "High", "priority": "〇", "qtype": "① System-related", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 68, "category": "6.Security measures for business systems and communication tools", "name": "Email automatic forwarding setting restrictions", "content": "Are all of the following implemented with regard to the automatic forwarding setting for email?\n*all received emails are automatically forwarded to another email address\n\n1. Users are prevented from enabling automatic email forwarding\n2. Prior approval is required if necessary for business", "standard": "① Must disable email automatic forwarding settings　\n② Must keep application/approval records", "evidence": "① Screenshots of configuration screens\n② Application/approval records requesting automatic forwarding configuration (within most recent year)", "article": "24(2)", "issue": "①", "risk": "High", "priority": "〇", "qtype": "① System-related", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 69, "category": "6.Security measures for business systems and communication tools", "name": "Prevention of impersonation email fraud", "content": "Are all of the following measures taken for employees in order to prevent email fraud/impersonation?\n\n1. make sure everyone is aware of the following\n　・Confirm the authenticity of the source and content of incoming e-mails.\n　・Do not allow the user to open attachments or URLs of untrustworthy e-mails, and do not enter IDs or passwords.\n　・Thoroughly operate payment processes to prevent transfers to fraudulent bank accounts, etc.\n2. Training to protect employees from targeted email attacks is conducted at least once a year", "standard": "① Must disseminate information for items 1 to the left\n② Must conduct email training noted in item 2 to the left", "evidence": "① Memos (rules, training materials, individual memos, etc.)\n② Email training record", "article": "24(4)\n10(2)", "issue": "①,②\n②", "risk": "High", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 70, "category": "6.Security measures for business systems and communication tools", "name": "Company-authorized chat tool conditions", "content": "Are the following satisfied for company-authorized chat tools?\n\n1. Two-factor authentication is implemented\n2. Communications are encrypted\n3. Communications and logs are stored\n4. There are no issues with systems or provider (operator) information management organizations\n\n*If the use of chat tools that do not satisfy 1, 3, and 4 above is required for business, the following alternative measures may also be used\n　1. Introduce a tool for storing chat tool communications and logs in a company-managed terminal (PC, etc.)\n　2. Establish rules to follow when using the chat tool (use company account/terminal, use group chat, do not handle confidential information) and disseminate these to employees in the form of written rules", "standard": "① Must not use chat tools for business, or must satisfy all items 1, 2, 3, and 4 to the left, with regard to \"company-authorized chat tools\"\n② If the use of chat tools that do not satisfy items 1, 3, and 4 to the left is required for business, alternative measures must be implemented", "evidence": "① Product information, screenshots of configuration screens, etc.\n② Rules and memos, such as screenshots confirming the introduction of tools to store communications and logs", "article": "24(2)", "issue": "②", "risk": "High", "priority": "", "qtype": "① System-related", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 71, "category": "6.Security measures for business systems and communication tools", "name": "Restrictions on external communications when using chat tools", "content": "Are employees informed to not engage in communication regarding the acquisition or forfeiture of rights or obligations (contracts, purchase orders, deliveries, etc.) when using chat tools for business when communicating with entities outside of the company?", "standard": "① Must inform employees of information to the left", "evidence": "① Memos", "article": "24(2)", "issue": "②ⅴ", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 72, "category": "6.Security measures for business systems and communication tools", "name": "Web conference system settings", "content": "Are the following measures implemented to prevent unauthorized access and eavesdropping/information leakage by unexpected participants when using a web conference system for business purposes?\n\n1. Client software is quickly updated to the latest version\n2. Participation must be approved by the host or additional participants are locked out\n3. Employees are informed that meetings are to be administered by the company whenever possible", "standard": "① Must inform employees of items 1, 2, and 3 to the left", "evidence": "① Memos", "article": "24(2)", "issue": "③", "risk": "Middle", "priority": "", "qtype": "②-2 Operations-related (other)", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 73, "category": "6.Security measures for business systems and communication tools", "name": "Connections with external systems through EDI, etc.", "content": "When connecting internal business systems with external systems using EDI, etc., are all of the following implemented?\n\n1. Provided with authentication and encryption functionality\n2. The risk of information leakage in the connection environment is confirmed prior to making a decision on whether to connect\n3. Systems are connected after entering into non-disclosure agreements", "standard": "① Must store confirmation results for items 1, 2, and 3 to the left for all EDI, etc.", "evidence": "① Screenshots of authentication screens\n② Results of checking external connection environments\n③ Contracts containing confidentiality clauses", "article": "20(4)\n34(8)", "issue": "", "risk": "Low", "priority": "", "qtype": "ー", "catNo": 6, "catShort": "Business Systems Security", "catShortTh": "ความปลอดภัยระบบงานธุรกิจ"}, {"no": 74, "category": "7.Measures to prepare for incidents and failures", "name": "Log acquisition and storage for network devices", "content": "Are all of the following logs obtained and stored for at least one year for remote access systems (VDI equipment, VDI servers, etc.), firewalls, web proxies, and DNS servers ?\n\n1. Logs are obtained and stored as per \"Appendix 3_Logging and Storage Requirements List\".\n2.The above logs must include the date and time that satisfy the following\n・Same time setting in the system\n・UTC in principle, but time zone is also required when it is unavoidable", "standard": "①All network devices in the company's network must be stored for at least one year for all items 1 and 2 on the left.\n\n① Must store all items indicated in Appendix 3 for at least one year, for all network devices in the company network", "evidence": "① Log configuration screens\n① Logs (actual logs)", "article": "25(2)", "issue": "", "risk": "Very High", "priority": "〇", "qtype": "① System-related", "catNo": 7, "catShort": "Incident Preparedness", "catShortTh": "การเตรียมพร้อมรับเหตุการณ์"}, {"no": 75, "category": "7.Measures to prepare for incidents and failures", "name": "Log acquisition and storage f
